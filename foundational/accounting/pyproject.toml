[project]
name = "accounting"
version = "0.1.0"
description = "Foundational accounting system with double-entry bookkeeping"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",

    # Database & ORM
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",           # PostgreSQL async driver
    "alembic>=1.13.1",           # Database migrations

    # Validation & Serialization
    "pydantic>=2.6.0",
    "pydantic-settings>=2.1.0",  # Settings management

    # Dependency Injection
    "dependency-injector>=4.41.0",

    # AWS SDK
    "boto3>=1.34.0",
    "aioboto3>=12.0.0",          # Async AWS operations

    # Utilities
    "python-ulid>=2.2.0",        # Sortable unique IDs
    "structlog>=24.1.0",         # Structured logging
    "python-json-logger>=2.0.7",
    "httpx>=0.26.0",             # Async HTTP client

    # Money & Currency
    "py-moneyed>=3.0",           # Currency handling
    "babel>=2.14.0",             # Localization

    # Date/Time
    "pendulum>=3.0.0",           # Better datetime handling
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "hypothesis>=6.100.0",       # Property-based testing
    "factory-boy>=3.3.0",        # Test fixtures
    "faker>=22.0.0",
    "httpx>=0.26.0",             # Test client
    "mypy>=1.8.0",
    "ruff>=0.2.0",               # Linting & formatting
    "pre-commit>=3.6.0",
    "sqlalchemy[mypy]>=2.0.25",  # SQLAlchemy type stubs
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = ["E501"]  # Line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
