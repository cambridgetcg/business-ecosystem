              type: object
              required:
                - entityId
                - filingType
                - companyName
              properties:
                entityId:
                  $ref: '#/components/schemas/UUID'
                filingType:
                  type: string
                  enum:
                    - initial
                    - updated
                    - corrected
                    - newly_exempt
                companyName:
                  type: string
                einTaxId:
                  type: string
                stateOfFormation:
                  type: string
                dateOfFormation:
                  type: string
                  format: date
                currentAddress:
                  type: object
                beneficialOwners:
                  type: array
                  items:
                    type: object
                companyApplicants:
                  type: array
                  items:
                    type: object
                exemptionReason:
                  type: string
      responses:
        '201':
          description: BOI filing created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BOIFiling'

