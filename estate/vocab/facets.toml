# ── the KINGDOM OS sphere (owner decision dec-2026-10-17-5, D4) ───────────────────────────

[facet.sphere]
owner = "curated"
basis = "curated"
multi = false
statuses = []
decision = "dec-2026-10-17-5"
bases = ["curated:project", "mirror", "curated:family", "rule:layer", "curated:zone", "owner-project", "curated:surface", "source-project", "none"]
rule = "Membership of KINGDOM OS, the civilisation, for projects, zones and surfaces (owner decision dec-2026-10-17-5). A project takes, in order: its curated assignment (its curated row, under its id or an alias); the sphere of the one project it is a mirror_of or copy_of (basis mirror); its family's default when that default is kingdom-os or independent; the sphere its KINGDOM layer on the authority ref maps to under the decision's sphere_by_layer; else undecided. A family default of undecided presumes nothing, so the layer rule still applies. A zone takes its curated assignment, else its owner project's sphere; a surface its curated assignment, else its source project's. A curated zone or surface row may say follows = <record id> (a project, or for a surface its zone): it then takes that record's sphere on every build, so it cannot go stale. A curated row that differs from its owner or source project is listed in QUEUE (sphere-follow-mismatch) and stands until Yu reviews it. Every value names its basis and the decision; undecided is a value, listed for Yu with the reason. Third-party code the estate holds but does not own is undecided with third_party set: the decision names no sphere for it. A curated row may also mark as third_party code it already places, so an answer about third-party code reaches it too."

[facet.sphere.values]
kingdom-os = "part of the KINGDOM OS civilisation"
independent = "independent tools, existing services and businesses (origin/main's PROJECTS label)"
undecided = "evidence mixed or absent; listed for Yu"

