# ── the business capability map (a display field of the Business view, not navigation) ──────

[business.capability]
owner = "curated"
basis = "curated"
multi = true
statuses = ["unassigned", "none"]
companion = "capability_extra"
bases = ["curated:project", "derived:packages", "mirror", "curated:package", "rule:package-path", "none"]
rule = "The business capabilities a project has code for, or does by hand (a dated manual claim). It is a display field of the Business view, not a navigation facet: only an owner decision makes it one. A project takes, in order: its curated row (curated/capabilities.toml, under its id or an alias); else the union of its packages that have code (derived:packages: the package records of a host repository, which a [[host]] row names); else the values of the one project it is a mirror_of or copy_of; else status unassigned when it is in business scope and none otherwise. A curated row with no values says the project has no business capability (status none). Business scope is one population for the whole Business view: a KINGDOM layer commerce or economy, a purpose group business_operations, payments_finance or commerce_marketplaces, a family commerce-tcg, commerce-ventures, economy-ventures or business-ecosystem, the role revenue, or the KINGDOM kind venture. Each value names its impl, operating claim, serves and reviewed flag in capability_extra.by_value. A capability that is only documented or designed is listed under designed and is never a value; an idea is never a value. be.framework_domain is relevance only: a run-band value it names that no row holds waits in QUEUE (capability-candidate). A package takes its curated row (curated:package, a [[capability]] row keyed by its package id), else the run-band value its directory names (rule:package-path: business-ecosystem's domain packages are named after their framework domain), else none; its impl is measured (code, code-unbuilt or unread) unless its curated row states stub or manual, and a package with no source holds no value: one with documents lists it as designed."

