measured-git = "git structure (alternates, nesting, submodules, worktrees)"
registry = "a REGISTRY.yaml claim"
portfolio = "a portfolio-map/1 hosting edge"
config = "an owner-edited config entry"

[vocab.attribution]
source = "portfolio-map/1 attribution classes, verbatim"
rule = "repository null if and only if candidate_only or unresolved. The overlay ranks them in this order."

[vocab.attribution.values]
deployment_commit_verified = "a deployment pinned to a verified source commit"
current_tracked_config = "a tracked deploy config in a clean canonical checkout"
current_source_document = "a current maintained document names the source: a REGISTRY repo claim, the curated survey, or a live scheduler definition that targets the checkout"
historical_source_evidence = "dated historical evidence, such as the 2026-10-01 portfolio map"
candidate_only = "a candidate without current evidence, or competing sources"
unresolved = "no source known"

[vocab.capability_impl]
rule = "How a capability exists in one record. Measured for packages (tool/packages.py), and a host project that takes its packages' values takes the first of their impls in this order; curated for whole projects. A capability that is only documented or designed has no impl: it is listed under designed."

[vocab.capability_impl.values]
code = "tracked source implements it at the measured commit (for a whole repository, a curated reading of its code)"
code-unbuilt = "source exists, but its package is on the build or typecheck quarantine list at the same commit (the list read at the checkout's HEAD)"
stub = "tracked source exists, but a curated row marks it a placeholder (for example a server that only answers health and info)"
manual = "a dated, curated claim that the business does this by hand, with no code (for example app store listing work)"
unread = "the files exist but the reader may not open them (deny list) or could not: unknown, never absent"

[vocab.capability_operating]
rule = "A dated CLAIM about whether the business uses the capability now, as of its row; curated, reviewed = false until Yu reviews it, and never derived from code."

[vocab.capability_operating.values]
in-use = "the business uses it now"
paused = "switched off on purpose and reversible, for example an interlock that refuses new checkouts"
retired = "deliberately ended"
never = "code exists but the business has never used it"
unknown = "no dated claim"

[vocab.capability_serves]
rule = "Who the capability serves; self unless a row says otherwise."

[vocab.capability_serves.values]
self = "the business itself"
customers = "sold or offered to customers as a product (for example loyalty offered to merchants)"
both = "used by the business and offered to customers"

# ── packages (record kind package, tool/packages.py) ────────────────────────────────────────

[vocab.package_manifest.values]
package-json = "a tracked package.json"
pyproject = "a tracked pyproject.toml"
both = "both manifests (a hybrid package)"
module-folder = "no manifest; the host row names the folder"

[vocab.package_static]
rule = "Static problems the package reader finds in tracked files; a package record lists the codes about it, the host summary counts them all."

[vocab.package_static.values]
workspace-glob-empty = "a workspace glob matches no tracked package"
extends-unresolved = "a tracked tsconfig extends a relative path that is not a tracked file"
duplicate-name = "two packages of one workspace declare the same name"
declared-not-imported = "a manifest declares an internal package that no non-test source imports"
imported-not-declared = "non-test source imports an internal package its manifest does not declare"
untracked-package = "a directory a workspace glob matches holds a manifest git does not track"

[vocab.package_build]
rule = "A package task (build, typecheck, lint, test) against the host's tracked quarantine list, read at the checkout's HEAD: the list is the contract its CI enforces there. An entry's error count and measured_at are dated evidence from an earlier commit, never compared with HEAD. The estate runs no build: gated is CI's contract, not an observed run."

[vocab.package_build.values]
gated = "not on the list: CI runs the task for this workspace package and fails when it fails"
quarantined = "on the list: CI skips the task until it is fixed"
not-run = "CI runs no such task for it: its package.json defines no script of that name, or no workspace glob includes it"
not-measured = "the list was not read as HEAD's: the host names none, it is missing, untracked or invalid, or census did not measure the checkout clean"

[vocab.surface_health.values]
up = "pulse observed it up"
down = "pulse observed it down"
contradicted = "a caveat check disagrees with the pulse observation"
unprobed = "no pulse row observes it"
unknown = "the pulse is missing or stale"

[vocab.scheduler_health.values]
healthy = "the last run succeeded"
failing = "the last run failed"
disabled = "the job is disabled"
unknown = "no run result is visible"

[vocab.artifact_kind.values]
state = "runtime state"
evidence = "evidence kept for a decision"
logs = "log files"
data = "data sets"
keys = "key material (never read)"
config = "configuration"
docs = "documents"
backup = "backups"
report = "generated reports"
mission = "mission state"
wallet = "wallet material (never read)"
cache = "caches"
tool-install = "an installed tool or daemon"
symlink-index = "a directory of symlinks into checkouts"
unknown = "not classified"

[vocab.tag_drop]
rule = "Why a raw survey tag sets nothing (vocab/tag-map.tsv drop=<reason>)."

[vocab.tag_drop.values]
echo = "repeats a family id or the record's own name"
event = "a dated event; it becomes a DRIFT history line"
queue = "used more than once but unmapped; waits in QUEUE for review"
evidence = "names evidence rather than a property"
identity = "names an identity rather than a property"
be-internal = "a business-ecosystem component name, kept on the group"
singleton = "used once; kept in the private raw tags in case it recurs"

[vocab.presence.values]
present = "observed in this run"
missing = "absent in this run for the first time"
gone = "absent in two consecutive runs at least 24 hours apart"

[vocab.freshness.values]
fresh = "within its fresh budget"
aging = "past fresh, within stale"
stale = "past its stale budget"
missing = "the source could not be found"
error = "the source could not be read"
