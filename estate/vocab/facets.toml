# Facet registry of the estate layer (vocab/facets.toml).
#
# The 13 navigation facets are the atlas filter chips and `estate ls --facet`. Facets that
# KINGDOM owns are POINTERS: they name where kingdom-os defines the vocabulary, and the values
# are read live from bin/harvest.ts on every build, never copied here and never extended.
# Overlay facets and every other vocabulary list each value with a one-line definition.
#
# This file and vocab/tag-map.tsv are the only committed files allowed to spell the risk
# vocabulary (privacy lint, spec 9.6). Facet values in records use the common facet shape:
# {value or values, status, basis, src, at, alt}.

[meta]
schema = "estate.facets/1"
navigation = ["layer", "kind", "state", "standing", "liveness", "running", "hosting", "stack", "exposure", "family", "role", "topic", "sphere"]
primary = "layer"
kingdom_owned = ["layer", "kind", "state", "owner_sister", "domain", "adopts", "conformance"]
bases = ["measured", "claimed", "curated", "derived", "imported"]
# An overlay facet that holds a value has this status; the per-facet statuses below name the
# states without a value. KINGDOM facets use the resolution statuses instead.
value_status = "set"

# Statuses of the per-ref resolution that layer, kind and state share (spec 6.8).
[resolution]
settled = "a schema-valid card value that no harvest rule overrides and the other ref agrees with"
roster-fallback = "no valid card value; the roster row, or a harvest rule, supplies an in-vocabulary value"
contested = "a harvest rule or the other ref disagrees with the card; the value is null and every candidate is listed with its source"
off-enum-only = "every claim lies outside the live vocabulary; the value is null and a P03 proposal opens"
unset = "no claim at all; the value is null and a P01 proposal opens"

# ── navigation facets owned by KINGDOM (pointers only) ────────────────────────────────────

[facet.layer]
owner = "kingdom"
pointer = "kingdom-os bin/harvest.ts CARD_ENUMS.layer"
order = "kingdom-os bin/harvest.ts LAYERS"
values_from = "live"
multi = false
statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"]
flags = ["ref_divergent"]
rule = "PRIMARY axis. Candidates per ref: the valid card value, the roster row, and the harvest override rules (today the citizens-dir forced value). The configured ref decides; a different result on the other ref sets ref_divergent and also makes the record contested. Card against roster is not a dispute: the card is authoritative and the roster drift becomes a proposal. Survey placements, tags and the Kingdom INDEX buckets never set it."

[facet.kind]
owner = "kingdom"
pointer = "kingdom-os bin/harvest.ts CARD_ENUMS.kind"
values_from = "live"
multi = false
statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"]
flags = ["ref_divergent"]
rule = "Resolved exactly like layer: the valid card value first, then the roster row."

[facet.state]
owner = "kingdom"
pointer = "kingdom-os bin/harvest.ts CARD_ENUMS.state"
values_from = "live"
multi = false
statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"]
flags = ["ref_divergent"]
rule = "The declared CLAIM, resolved like layer and never merged with the measured liveness facet. A value outside the vocabulary, or one carrying an inline comment, is kept raw and opens P03."

# ── navigation facets owned by the overlay ────────────────────────────────────────────────

[facet.standing]
owner = "overlay"
basis = "derived"
multi = false
statuses = ["unknown"]
rule = "The SCHEMA ladder from listed to owned, read on the configured ref. unknown means a forge-only record that no KINGDOM key lists, or a card that could not be read."

[facet.standing.values]
owned = "a tracked, schema-valid kingdom.yaml card"
card-untracked = "a schema-valid card that git does not track"
card-invalid = "a card with any missing, off-vocabulary or malformed field (an unknown dependency alone does not make it invalid; it opens P06)"
listed = "no card, but a roster row, a REGISTRY repo claim or a sites.json key names it"
unlisted = "no card and no KINGDOM key"

[facet.liveness]
owner = "overlay"
basis = "measured"
multi = false
statuses = ["unknown"]
flags = ["resting", "checkout_present"]
rule = "MEASURED only; a card state never sets it. archived comes from the forge archived flag alone; active from the newest commit on any checkout or the forge pushed_at within 30 days; gone from no checkout and absence from a fresh forge listing; dormant otherwise. unknown when no measuring source saw the record. resting flags a HALT, REST.md or CADENCE marker in the canonical checkout."

[facet.liveness.values]
active = "newest commit on any checkout, or forge pushed_at, at most 30 days old"
dormant = "measured, but nothing newer than 30 days"
archived = "the forge marks the repository archived"
gone = "no checkout here and absent from a fresh forge listing"

[facet.running]
owner = "overlay"
basis = "derived"
multi = false
statuses = ["unknown"]
rule = "Over surfaces attributed as deployment_commit_verified, current_tracked_config or current_source_document, and over schedulers that target the record: contradicted if any is contradicted, else down if any is down, else up if any is observed up, else unprobed; none when nothing is attributed. unknown when the pulse is missing or older than 24 hours."

[facet.running.values]
up = "an attributed surface or scheduler is observed up"
down = "an attributed surface or scheduler is observed down or failing"
contradicted = "a private caveat check disagrees with the pulse observation"
unprobed = "attributed surfaces or schedulers exist, but nothing observes them"
none = "nothing is attributed to the record"

[facet.hosting]
owner = "kingdom+overlay"
kingdom_source = "kingdom-os REGISTRY.yaml services[].runtime prefix, read live"
basis = "derived"
multi = true
statuses = ["none", "unknown"]
extensions = ["x-github-pages", "x-aws", "x-npm", "x-pypi", "x-homebrew-tap", "x-vps", "x-gha-schedule", "x-cron", "x-hermes-cron"]
rule = "Every value carries its attribution class. A deploy config file alone gives current_tracked_config only when it is tracked and its checkout is clean; otherwise candidate_only. The listed REGISTRY tokens are the ones seen on 2026-10-17; prefixes read live from REGISTRY are accepted too."

