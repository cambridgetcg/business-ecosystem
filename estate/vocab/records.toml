# Record contract of the estate layer (vocab/records.toml): THE single source of every record
# kind, its id form, its fields, their types and their privacy class (spec section 3).
# model.validate() checks every build against this file; the README links here.
#
# Field spec keys:
#   type      str | int | bool | iso (ISO-8601 time) | date (YYYY-MM-DD) | list | dict | facet | any
#   nullable  the value may be null
#   optional  the key may be absent
#   enum      a name in [enum] below; "facets:<table path>" (values of vocab/facets.toml, "/"
#             separated); or "kingdom:<field>" (the live CARD_ENUMS of the build's ref, never a copy)
#   statuses  for facets: statuses allowed without a value ("set" is always allowed with one)
#   ref       the value (or each list item) is the id of a record of that kind ("a|b" for either)
#   privacy   committed | private | derived; a field without one has its kind's class
#
# Privacy classes: committed (curated knowledge only, scrubbed), private (measured or
# risk-bearing; lives under the private area only), derived (computed from private inputs, so
# private too). Committed files never hold local ids, paths, IPs, provider ids or risk
# assignments.

[meta]
schema = "estate.records/1"
snapshot_schema = "estate.snapshot/1"
run_schema = "estate.run/1"
proposal_schema = "estate.proposal/1"
kinds = ["project", "checkout", "group", "family", "surface", "zone", "scheduler", "artifact", "device", "account", "relation", "package", "proposal", "source"]
in_records = ["project", "checkout", "group", "family", "surface", "zone", "scheduler", "artifact", "device", "account", "relation", "package"]
proposals_file = "proposals.jsonl"
sources_file = "run.json"

[meta.privacy]
committed = "curated knowledge keyed by forge id, scrubbed by curate.scrub and the privacy lint"
private = "measured or risk-bearing; only under the private area (0700 dirs, 0600 files)"
derived = "computed from private inputs; private as well"

[shape.fact]
v = "any value"
basis = "measured | claimed | curated | derived | imported"
src = "a source id (src:...)"
at = "ISO-8601 time the value was observed or claimed"

[shape.facet]
value = "the single value, or null (multi-valued facets use values)"
values = "the list of values of a multi-valued facet"
status = "set when a value is held; otherwise a status listed for the facet in vocab/facets.toml"
basis = "measured | claimed | curated | derived | imported | kingdom"
src = "a source id"
at = "ISO-8601 time"
alt = "other facts considered"
kingdom_extra = "layer, kind and state add ref, resolved_by, candidates[{value, source, ref, overruled_by?}], off_enum[{value, source, ref}], ref_divergent and by_ref{ref: {status, value}}; decided_by names the owner decision that settled the value, authority the decision that made ref the primary ref (set where the refs diverge)"
sphere_extra = "sphere (projects, zones, surfaces) always holds a value; its basis is one of vocab/facets.toml [facet.sphere].bases, and it adds decision (the owner decision defining the facet), confidence, reviewed, via (the project or alias the value came from), layer (rule:layer), family (curated:family), reason (why; always set when undecided), evidence (the full private text behind a curated row), follows (the record a curated zone or surface row takes its value from) and third_party; and, when a later decision extends the facet, decided_by (the decision that set this value), was (the curated undecided reason a layer-rule value replaced), reviewed_by (agent) and review_decision"
capability_extra = "the business capability facet (projects, a navigation facet by decision dec-2026-10-20-1; and the capability field of package records) has the facet shape with its basis one of vocab/facets.toml [facet.capability].bases, and adds by_value {<value>: {impl, operating, serves, and for derived:packages via, the package ids holding it}} (vocab/facets.toml capability_impl, capability_operating and capability_serves; operating is a claim as of the row), designed (values only documented or designed, never values), scope (why the project is in business scope; empty when it is not), candidates (run-band values be.framework_domain names that the project holds neither as a value nor as designed), via (the alias or mirrored project the values came from), reason (why unassigned or none), and from a curated row its confidence, reviewed, review_after, source, evidence (the committed short text) and evidence_full (the private text)"

[enum]
basis = ["measured", "claimed", "curated", "derived", "imported", "kingdom"]
privacy = ["committed", "private", "derived"]
presence = ["present", "missing", "gone"]
measure_status = ["ok", "partial", "skipped-partial-clone", "timeout", "error", "gone-during-run"]
gitkind = ["dir", "file"]
upstream_state = ["tracking", "none", "gone", "unmapped", "unborn", "unknown"]
dirty_mode = ["normal", "skipped-partial", "unknown"]
canonical_basis = ["override", "scheduler-target", "default-branch-newest", "shortest-path"]
mechanism = ["launchd", "cron", "hermes", "gha", "cf-cron"]
dns_provider = ["cloudflare", "codeberg", "vercel", "external", "unknown"]
backup = ["none", "git-remote", "tigris", "unknown"]
member_kind = ["project", "checkout", "subpath"]
source_class = ["claim", "measure", "imported", "curated"]
freshness = ["fresh", "aging", "stale", "missing", "error"]
wake_basis = ["wake-md", "hook-file", "session-start", "global", "none"]
surface_health = ["up", "down", "contradicted", "unprobed", "unknown"]
scheduler_health = ["healthy", "failing", "disabled", "unknown"]
proposal_status = ["open", "resolved-observed", "resolved-upstream", "conflict-with-upstream", "declined", "deferred", "superseded"]
proposal_owner = ["kingdom-os", "repo", "yu", "pr1-owner"]
target_ref = ["worktree", "origin/main", "checkout-head"]
upstream_status = ["n/a", "matches-proposed", "differs", "same-as-current"]
proposal_rule = ["P01", "P02", "P03", "P04", "P05", "P06", "P07", "P08", "P09", "P10", "P11", "P12", "P13", "P14", "P15", "P16", "P17"]
evidence_class = ["measure", "claim", "curated", "decision"]

# ── project ─────────────────────────────────────────────────────────────────────────────────

[kind.project]
id = "a forge id (host/owner/repo, lowercase), or the local form for a checkout with no forge remote: the local prefix, a colon and the home-relative path; aliases carry the root-commit form"
id_pattern = '^(?:[a-z0-9][a-z0-9.-]*\.[a-z]{2,}/[^/\s]+/\S+|local[:]\S+)$'
privacy = "private"
committed_part = "the curated rows of curated/families/*.toml, keyed by forge id"

[kind.project.fields]
kind = { type = "str" }
id = { type = "str" }
name = { type = "str", nullable = true }
aliases = { type = "list" }
local = { type = "bool" }
forge = { type = "dict", nullable = true }
kingdom = { type = "dict", nullable = true }
facets = { type = "dict" }
display = { type = "dict" }
display_src = { type = "dict" }
flags = { type = "dict" }
claims = { type = "list" }
measures = { type = "dict" }
curated = { type = "dict", nullable = true, privacy = "committed" }
checkouts = { type = "list", ref = "checkout" }
canonical_checkout = { type = "str", nullable = true, ref = "checkout" }
canonical_basis = { type = "str", nullable = true, enum = "canonical_basis" }
group_ids = { type = "list", ref = "group" }
family_id = { type = "str", nullable = true, ref = "family" }
relations = { type = "list", ref = "relation" }
# packages: the package records of a host repository (a [[host]] row); optional only because missing
# and gone stubs carried from runs before package records lack it.
packages = { type = "list", ref = "package", optional = true }
surfaces = { type = "list", ref = "surface" }
schedulers = { type = "list", ref = "scheduler" }
proposals = { type = "list", ref = "proposal" }
legal_entity_id = { type = "str", nullable = true }
risks = { type = "list", enum = "facets:vocab/risk" }
risk_detail = { type = "list" }
risk_notes = { type = "list" }
tag_expectations = { type = "list" }
unmapped_tags = { type = "list" }
freshness = { type = "dict" }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }
absences = { type = "int", optional = true }
last_seen = { type = "iso", optional = true, nullable = true }

[kind.project.subfields.facets]
layer = { type = "facet", enum = "kingdom:layer", statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"] }
kind = { type = "facet", enum = "kingdom:kind", statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"] }
state = { type = "facet", enum = "kingdom:state", statuses = ["settled", "roster-fallback", "contested", "off-enum-only", "unset"] }
standing = { type = "facet", enum = "facets:facet/standing", statuses = ["unknown"] }
liveness = { type = "facet", enum = "facets:facet/liveness", statuses = ["unknown"] }
running = { type = "facet", enum = "facets:facet/running", statuses = ["unknown"] }
hosting = { type = "facet", enum = "facets:facet/hosting", statuses = ["none", "unknown"] }
stack = { type = "facet", enum = "facets:facet/stack", statuses = ["unknown"] }
exposure = { type = "facet", enum = "facets:facet/exposure", statuses = ["unknown"] }
family = { type = "facet", enum = "facets:facet/family", statuses = ["unassigned"] }
role = { type = "facet", enum = "facets:facet/role", statuses = ["unknown"] }
topic = { type = "facet", enum = "facets:facet/topic", statuses = ["none"] }
# Optional only because missing and gone stubs carried from runs before the facet lack it; every
# present project has one (tool/sphere.py).
sphere = { type = "facet", enum = "facets:facet/sphere", statuses = [], optional = true }
# The business capability map (decision dec-2026-10-20-1), in the common facet shape plus
# capability_extra. Optional only because missing and gone stubs carried from runs before it lack it.
capability = { type = "facet", enum = "facets:facet/capability", statuses = ["unassigned", "none"], optional = true }

[kind.project.subfields.display]
owner_sister = { type = "str", nullable = true, enum = "kingdom:owner_sister" }
domain = { type = "str", nullable = true, enum = "kingdom:domain" }
adopts = { type = "list" }
provenance = { type = "str", nullable = true, enum = "facets:display/provenance" }
purpose_group = { type = "str", nullable = true, enum = "facets:business/purpose_group" }
"be.framework_domain" = { type = "list", enum = "facets:business/be.framework_domain" }
role_status = { type = "str", nullable = true, enum = "facets:display/role_status" }

[kind.project.subfields.flags]
resting = { type = "bool" }
checkout_present = { type = "bool" }
incidental = { type = "bool" }
orphaned_curation = { type = "bool" }

[kind.project.subfields.measures]
last_commit_any = { type = "iso", nullable = true }
pushed_at = { type = "iso", nullable = true }
dirty_total = { type = "int", nullable = true }
dirty_unknown = { type = "int" }
unpushed_commits = { type = "int", nullable = true }
checkouts_n = { type = "int" }
measured_checkouts = { type = "int" }

[kind.project.subfields.kingdom]
card_present = { type = "bool", nullable = true }
card_checkout = { type = "str", nullable = true, ref = "checkout" }
card_tracked = { type = "bool", nullable = true }
card_text_sha256 = { type = "str", nullable = true }
card_text = { type = "str", nullable = true, privacy = "private" }
card_raw = { type = "dict", nullable = true, privacy = "private" }
card_valid = { type = "dict" }
card_schema_ok = { type = "bool", nullable = true }
card_field_ok = { type = "bool", nullable = true }
card_diagnostics = { type = "list" }
off_enum = { type = "dict" }
card_by_ref = { type = "dict" }
roster_row = { type = "dict", nullable = true }
roster_by_ref = { type = "dict" }
harvest_view = { type = "dict" }
fleet_checkout = { type = "str", nullable = true, ref = "checkout" }
graph_entry = { type = "dict", nullable = true }
registry_ids = { type = "list" }
sites_keys = { type = "list" }
conformance = { type = "dict" }
wake_basis = { type = "str", enum = "wake_basis" }
ref = { type = "str", nullable = true }

# ── checkout ────────────────────────────────────────────────────────────────────────────────

[kind.checkout]
