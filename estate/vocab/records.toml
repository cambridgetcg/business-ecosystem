id_pattern = '^co:[0-9a-f]{12}$'
privacy = "private"

[kind.checkout.fields]
kind = { type = "str" }
id = { type = "str" }
path = { type = "str" }
rel = { type = "str" }
project_id = { type = "str", nullable = true, ref = "project" }
project_basis = { type = "str", nullable = true }
checkout_role = { type = "str", nullable = true, enum = "facets:vocab/checkout_role" }
gitkind = { type = "str", nullable = true, enum = "gitkind" }
hub = { type = "str", nullable = true }
is_worktree = { type = "bool" }
is_hub = { type = "bool" }
submodule_of = { type = "str", nullable = true }
nested_in = { type = "str", nullable = true }
discovered_by = { type = "str" }
branch = { type = "str", nullable = true }
detached = { type = "bool", nullable = true }
head = { type = "str", nullable = true }
born = { type = "bool", nullable = true }
shallow = { type = "bool", nullable = true }
root_commit = { type = "str", nullable = true }
root_commits = { type = "int", nullable = true }
last_commit_at = { type = "iso", nullable = true }
last_author = { type = "str", nullable = true, privacy = "private" }
commits = { type = "int", nullable = true }
upstream = { type = "dict" }
unpushed_commits = { type = "int", nullable = true }
stash_count = { type = "int", nullable = true }
dirty = { type = "dict" }
partial = { type = "dict" }
alternates = { type = "list" }
lends_objects_to = { type = "list" }
worktrees = { type = "dict" }
remotes = { type = "dict", nullable = true }
primary_remote = { type = "str", nullable = true }
primary_remote_name = { type = "str", nullable = true }
tracked_files = { type = "int", nullable = true }
top_ext = { type = "list", nullable = true }
manifests = { type = "list", nullable = true }
manifests_tracked = { type = "list", nullable = true }
workflows = { type = "list", nullable = true }
card = { type = "dict" }
has_claude_md = { type = "bool", nullable = true }
wake_markers = { type = "dict", nullable = true }
fate = { type = "bool", nullable = true }
rest_marker = { type = "list", nullable = true }
readme_title = { type = "str", nullable = true }
post_commit_hook = { type = "bool", nullable = true }
measure_status = { type = "str", nullable = true, enum = "measure_status" }
errors = { type = "list" }
notes = { type = "list" }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }
absences = { type = "int", optional = true }
last_seen = { type = "iso", optional = true, nullable = true }

[kind.checkout.subfields.upstream]
state = { type = "str", enum = "upstream_state" }
ref = { type = "str", nullable = true }
ahead = { type = "int", nullable = true }
behind = { type = "int", nullable = true }
as_of_fetch = { type = "iso", nullable = true }

[kind.checkout.subfields.dirty]
