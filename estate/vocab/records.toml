[kind.device]
id = "device:<slug>"
id_pattern = '^device:\S+$'
privacy = "private"

[kind.device.fields]
kind = { type = "str" }
id = { type = "str" }
label = { type = "str", nullable = true }
device_kind = { type = "str", nullable = true }
role = { type = "str", nullable = true }
status = { type = "str", nullable = true }
evidence = { type = "any", nullable = true }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }

[kind.account]
id = "account:<provider>:<label>"
id_pattern = '^account:\S+$'
privacy = "private"
note = "names only; credential_artifacts holds artifact ids, never credentials"

[kind.account.fields]
kind = { type = "str" }
id = { type = "str" }
provider = { type = "str", nullable = true }
label = { type = "str", nullable = true }
purpose = { type = "str", nullable = true }
used_by = { type = "list" }
credential_artifacts = { type = "list" }
# owns: [{id, decision, basis, observed}], the records an owner decision attributes to this account;
# observed is false when this run saw no such record. decided_status: {status, decision, provider,
# note}, a provider status an owner decision set (in-progress-elsewhere).
owns = { type = "list", optional = true }
decided_status = { type = "dict", nullable = true, optional = true }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }

# ── relation ────────────────────────────────────────────────────────────────────────────────

[kind.relation]
id = "rel:<sha12 of from|verb|to>, with |<channel kind>:<channel name> appended for a wire that names a channel"
id_pattern = '^rel:[0-9a-f]{12}$'
privacy = "private"
committed_part = "[[project.relations]] in curated/families/*.toml (forge or group ids at both ends) and the [[wire]] rows of curated/wires.toml"
note = "Wires (tool/wires.py) are relations: measured depends_on edges between package records, and curated [[wire]] rows. A wire adds code_state and, when curated, its claim, stage, verdict, channel, anchors and flow; code_state and stage are independent of each other."

[kind.relation.fields]
kind = { type = "str" }
id = { type = "str" }
from = { type = "str", ref = "project|group|package" }
verb = { type = "str", enum = "facets:vocab/relation" }
to = { type = "str", ref = "project|group|package" }
basis = { type = "str", enum = "facets:vocab/relation_basis" }
also = { type = "list" }
raw_kind = { type = "str", nullable = true }
note = { type = "str", nullable = true }
src = { type = "str", nullable = true }
at = { type = "iso" }
# Wires only (tool/wires.py). code_state: what the code shows (null when what decides it was not read);
# claimed {code_state, stage}: a curated row's claim; stage: measured (designed, demonstrated, accepted,
# active, unknown); run: the latest run on main of the workflow a demonstrated claim names, as build --forge
# read it ({id, status, conclusion, head_sha, event, created_at}; null when not read); verdict: the claim
# against measurement; anchors [{side, path, text, found, files}].
name = { type = "str", optional = true }
code_state = { type = "str", nullable = true, optional = true, enum = "facets:vocab/wire_code_state" }
reason = { type = "str", nullable = true, optional = true }
claimed = { type = "dict", optional = true }
stage = { type = "str", nullable = true, optional = true, enum = "facets:vocab/wire_stage" }
stage_reason = { type = "str", nullable = true, optional = true }
run = { type = "dict", nullable = true, optional = true }
verdict = { type = "str", optional = true, enum = "facets:vocab/wire_verdict" }
channel = { type = "dict", nullable = true, optional = true }
anchors = { type = "list", optional = true }
flow = { type = "str", optional = true }
hop = { type = "int", optional = true }
decision = { type = "str", optional = true }
demonstrated_by = { type = "str", optional = true }
evidence = { type = "str", optional = true }
source = { type = "str", optional = true }
reviewed = { type = "bool", optional = true }
as_of = { type = "date", optional = true }
review_after = { type = "date", optional = true }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }

# ── package ─────────────────────────────────────────────────────────────────────────────────

[kind.package]
id = "pkg:<host forge id>//<subpath>: a package of a host repository named by a [[host]] row (tool/packages.py)"
id_pattern = '^pkg:[a-z0-9][a-z0-9.-]*\.[a-z]{2,}/[^/\s]+/[^/\s]+//[A-Za-z0-9._/@-]+$'
privacy = "private"
committed_part = "the [[host]] rows of curated/capabilities.toml, and its [[capability]] rows keyed by a package id"
note = "measured from the tracked files of the host's canonical checkout, read through the deny list (sources.read_packages); build state from the tracked quarantine list the host row names, at the checkout's HEAD (packages.build_state)"

[kind.package.fields]
kind = { type = "str" }
id = { type = "str" }
host = { type = "str", ref = "project" }
subpath = { type = "str" }
name = { type = "str", nullable = true }
manifest = { type = "str", enum = "facets:vocab/package_manifest" }
workspace = { type = "bool" }
# scripts: which of build, typecheck, lint and test its package.json scripts define.
scripts = { type = "list" }
measures = { type = "dict" }
deps = { type = "dict" }
imports = { type = "dict" }
# imported_by: the names of the packages whose non-test source imports this one.
imported_by = { type = "list" }
static = { type = "list", enum = "facets:vocab/package_static" }
build = { type = "dict" }
# capability: the business capability field (capability_extra); basis curated:package, rule:package-path or none.
capability = { type = "facet", enum = "facets:facet/capability", statuses = ["none"] }
group_ids = { type = "list", ref = "group" }
# relations: the relation records at either end of which this package stands (wires, tool/wires.py);
# optional only because missing and gone stubs carried from runs before wires lack it.
relations = { type = "list", ref = "relation", optional = true }
at_commit = { type = "str", nullable = true }
commit_date = { type = "iso", nullable = true }
at_head = { type = "bool", nullable = true }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }
absences = { type = "int", optional = true }
last_seen = { type = "iso", optional = true, nullable = true }

[kind.package.subfields.measures]
src_files = { type = "int" }
loc = { type = "int" }
loc_by_lang = { type = "dict" }
test_files = { type = "int" }
md_files = { type = "int" }
unread_files = { type = "int" }
loc_partial = { type = "bool" }

[kind.package.subfields.deps]
declared_internal = { type = "list" }
declared_external_n = { type = "int" }

[kind.package.subfields.imports]
internal = { type = "list" }
undeclared = { type = "list" }

# build: the package against its host's quarantine list. tasks maps build, typecheck, lint and test to
# a vocab/facets.toml package_build value; quarantined lists the entries naming it ({task, errors,
# measured_at}: dated evidence, measured_at being the commit its count was measured at); unbuilt is
# true when its build or typecheck is quarantined, null when the list was not read as HEAD's.
[kind.package.subfields.build]
list = { type = "str", nullable = true }
status = { type = "str", nullable = true }
reason = { type = "str", nullable = true }
tasks = { type = "dict" }
quarantined = { type = "list" }
unbuilt = { type = "bool", nullable = true }

# ── proposal (proposals.jsonl, schema estate.proposal/1) ───────────────────────────────────

[kind.proposal]
id = "prop:<rule>:<sha12 of rule|file|record|field|proposed>, stable across runs"
id_pattern = '^prop:P\d{2}:[0-9a-f]{12}$'
privacy = "private"
note = "Nothing is ever applied. card_text puts basis notes on comment lines above each field, never inline; patch previews diff the origin/main blob (its sha pinned) and the worktree blob."

[kind.proposal.fields]
schema = { type = "str" }
id = { type = "str" }
rule = { type = "str", enum = "proposal_rule" }
title = { type = "str" }
target = { type = "dict" }
target_ref = { type = "str", enum = "target_ref" }
current = { type = "dict" }
proposed = { type = "dict" }
options = { type = "list" }
basis = { type = "list" }
evidence = { type = "list", privacy = "private" }
needs_yu = { type = "bool" }
priority = { type = "int" }
bulk_key = { type = "str", nullable = true }
bulk_count = { type = "int" }
collab = { type = "dict", nullable = true }
upstream = { type = "dict" }
status = { type = "str", enum = "proposal_status" }
first_seen = { type = "iso" }
last_seen = { type = "iso" }
decision_ref = { type = "str", nullable = true }
# sphere: the sphere of the proposal's subject (its record, or all its members when they agree);
# optional because proposals carried from earlier runs lack it.
sphere = { type = "str", nullable = true, optional = true, enum = "facets:facet/sphere" }

[kind.proposal.subfields.target]
owner = { type = "str", enum = "proposal_owner" }
repo_id = { type = "str", nullable = true }
file = { type = "str", nullable = true }
record_id = { type = "str", nullable = true }
field = { type = "str", nullable = true }

[kind.proposal.subfields.upstream]
worktree_blob = { type = "str", nullable = true }
origin_main_blob = { type = "str", nullable = true }
origin_main_commit = { type = "str", nullable = true }
status = { type = "str", enum = "upstream_status" }

# ── source (run.json sources, keyed by id) ─────────────────────────────────────────────────

[kind.source]
id = "src:<kind>[:<ref or index>]"
id_pattern = '^src:\S+$'
privacy = "private"
required = ["src:census", "src:kingdom:worktree", "src:roster", "src:pulse"]

[kind.source.fields]
id = { type = "str" }
kind = { type = "str" }
class = { type = "str", enum = "source_class" }
status = { type = "str", nullable = true }
locator_id = { type = "str", nullable = true }
sha256 = { type = "str", nullable = true }
observed_at = { type = "any", nullable = true }
age_s = { type = "int", nullable = true }
budget = { type = "dict", nullable = true }
freshness = { type = "str", enum = "freshness" }
required = { type = "bool" }
configured = { type = "bool" }
coverage = { type = "dict", nullable = true }
note = { type = "str", nullable = true }
propagates = { type = "str", nullable = true, optional = true }
