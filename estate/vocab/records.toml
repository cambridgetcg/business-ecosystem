# ── group and family ────────────────────────────────────────────────────────────────────────

[kind.group]
id = "group:<family>/<slug>"
id_pattern = '^group:[a-z0-9-]+/[a-z0-9._-]+$'
privacy = "private"
committed_part = "the [[group]] rows of curated/families/*.toml whose member rule is path-free"

[kind.group.fields]
kind = { type = "str" }
id = { type = "str" }
label = { type = "str", nullable = true }
family_id = { type = "str", nullable = true, ref = "family" }
what = { type = "str", nullable = true }
role = { type = "list", enum = "facets:facet/role" }
