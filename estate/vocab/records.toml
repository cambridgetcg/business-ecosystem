id = { type = "str" }
provider = { type = "str", nullable = true, enum = "facets:facet/hosting" }
name = { type = "str", nullable = true }
hostnames = { type = "list" }
audience = { type = "str", nullable = true }
registry = { type = "dict", nullable = true }
health = { type = "dict" }
source_project = { type = "str", nullable = true, ref = "project" }
attribution = { type = "dict" }
competing_sources = { type = "list", ref = "project" }
unresolved_projects = { type = "list" }
# account: {id, provider, decision, basis}, set when an owner decision attributes the surface to the
