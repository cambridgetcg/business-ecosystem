member_rule = { type = "dict" }
members = { type = "list", privacy = "private" }
member_kind = { type = "str", nullable = true, enum = "member_kind" }
member_projects = { type = "list", ref = "project" }
count_at_survey = { type = "int", nullable = true }
count_now = { type = "int", nullable = true }
delta = { type = "int", nullable = true }
member_note = { type = "str", nullable = true }
kingdom_claims = { type = "dict" }
canonical_location = { type = "str", nullable = true, privacy = "private" }
committed = { type = "bool" }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }

[kind.family]
id = "family:<slug>"
id_pattern = '^family:[a-z0-9-]+$'
privacy = "committed"
private_part = "summary_full, drift and nongit_paths"

[kind.family.fields]
kind = { type = "str" }
id = { type = "str" }
label = { type = "str", nullable = true }
summary = { type = "str", nullable = true }
open_questions = { type = "list" }
as_of = { type = "date", nullable = true }
review_after = { type = "date", nullable = true }
reviewed = { type = "bool", nullable = true }
source = { type = "str", nullable = true }
heavy = { type = "bool" }
# The family's sphere default ([family.sphere]: value, evidence, source, reviewed, as_of, review_after).
sphere = { type = "dict", nullable = true, optional = true }
summary_full = { type = "str", nullable = true, privacy = "private" }
drift = { type = "list", privacy = "private" }
nongit_paths = { type = "list", privacy = "private" }
projects_n = { type = "int" }
presence = { type = "str", enum = "presence" }
missing_since = { type = "iso", nullable = true }
observed_at = { type = "iso" }

# ── surface and zone ────────────────────────────────────────────────────────────────────────

[kind.surface]
