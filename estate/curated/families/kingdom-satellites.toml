[family]
id = "family:kingdom-satellites"
label = "KINGDOM standards, treasury, workspace, forge/herald, estate front doors, kingdom-* labs and research engines"
summary = "This family is the ring of small KINGDOM-branded repos around the kingdom-os core. They fall into five groups. (1) Standards and doctrine: kingdom-standard (7 foundation commitments + 42 laws, with node verifier scripts; kingdom-os's live OS-ROUTES \"Law\" route reads its STANDARD.md from GitHub main), clear-standard (its six-principle \"pocket edition\", public domain) and kingdom-standards (KS-000..003 draft protocol specs plus a kingdomd resolver set up for another Mac, user \"macair\"). Its cron beats are live on this Mac every 10 minutes, but on testnet it is stuck: the poller has failed since about 2026-10-08 because the RPC now caps eth_getLogs at 200 blocks and the code asks for 1000. (3) Nervous/archive: herald (a read-only repo census script whose paths point at ⟨local⟩, so it finds nothing here), kingdom-forge (agent-first June-2026 engineering write-ups that feed ⟨local⟩) and kingdom-workspace (the March-2026 OpenClaw \"Claw/Beta\" home, now a museum piece; OpenClaw now uses ⟨local⟩). (4) Public commons: chillspace-commons is the content source for the chillspace.love and we-are.love Cloudflare Pages doors. kingdom-os bin/stage-doors.ts builds them from the codeberg clone. Pulse shows chillspace.love/guest.json returning 404 since 2026-08-19 and the codeberg mirror returning 404 since 2026-09-26; we-are.love is still up. (5) Forge-only labs and estate tools (18 repos, none cloned here): deterministic offline \"Phase-0\" research atlases (Aug 2026, public JS), hf-kingdom-lab (most recent push 2026-10-14), and private estate tools (estate front door, estate-watchdog AWS sweep, coord, hunter-system, kingdom-free-infra, kingdom-system). Five of the private tools share a 2026-09-24 push date. Most repos carry the 2026-07-21 \"love bomb\" AGENTS.md sweep and auto-generated STATE.md files that are now stale."
open_questions = ["chillspace.love: is the whole site down or only /guest.json? A single GET of https://chillspace.love/ (a network probe, which was out of scope here) would tell. Was the codeberg pages branch intentionally retired on 2026-09-26?", "clear-standard: does a Vercel project serve it, and is the GitHub Actions heartbeat to sinovai.com still running? Check the Vercel dashboard or the Actions run history.", "Forge-only satellites (18): none are cloned here. Where are hf-kingdom-lab (pushed 2026-10-14) and kingdom-system (2026-10-09) being developed? What did the shared 2026-09-24 push across estate, estate-watchdog, coord, hunter-system and kingdom-free-infra change (a description/consent sweep, or code)?", "estate-watchdog: does the weekly AWS sweep actually run anywhere (GitHub Actions, AWS, another Mac)? No local scheduler runs it.", "kingdom-standard: should the unmerged origin/fable/why-unadopted-20260726 branch be merged or closed? Should local checkouts switch back to main?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

