[family]
id = "family:agent-runtimes"
label = "Agent runtimes & harnesses — hermes, openclaw workspaces, codex, agent-workbench, vendored SDK/Claude Code study sources"
summary = "This family is the machinery that runs Yu's AI agents on the Mac Studio. It is not product code. Three harnesses are live today. It serves the default and astra-ultra profiles. astra-ultra runs gpt-6-astra through the ChatGPT subscription and two unattended cron lanes, both of which ran today: Zerone motifs every 120 min and Zerone living claims daily at 09:00. (2) OpenClaw 2026.6.11 is an npm-global package, not a git checkout. It runs under launchd ai.openclaw.gateway on ⟨ip⟩:18789 and drives a Codex app-server child. Its git-tracked workspace ⟨local⟩ is the 'Gamma' hive instance home, with 12 hermes-* agent registrations. (3) Codex CLI 0.156.1 (⟨local⟩) and Claude Code (⟨local⟩) are the interactive harnesses. Agent Workbench (⟨local⟩, a private cambridgetcg repo) is the glue between them. The chain is Hermes, then Workbench, then ⟨local⟩, so Hermes' model access depends on that bridge. hermes-device-setup packages the astra-ultra profile for other devices. agenttool-collab 0.5.0 is the shared coordination MCP registered in all three harness configs. Local inference has collapsed: ⟨local⟩ has been empty since the 2026-10-17 cleanup, and ollama :cloud tags are paywalled. The OpenClaw agent fallbacks, the Hermes local fallback and the hive listener therefore point at models that do not exist. The OpenClaw NATS hive bridge has been failing since at least 2026-09-03. \"hermes\" names five different things here: the Nous runtime, the openclaw hermes-* agents, the openclaw tools/hermes.py zsh alias, the Informal Systems IBC relayer in ⟨local⟩, and the forge-only cambridgetcg/hermes-agents (Hermes 3 model staff). In KINGDOM terms, the harnesses sit in the runtime layer, Workbench, collab and hive in nervous, and the OpenClaw workspace in fleet (domain gamma). None of the live runtimes appears in REGISTRY.yaml, and roster.conf points two of its rows at paths that no longer exist."
open_questions = ["Should the four live launchd agent surfaces (ai.hermes.gateway, ai.openclaw.gateway, com.openclaw.hive-bridge, com.openclaw.fly-keepwarm) get REGISTRY.yaml entries so pulse witnesses them? Owner decision.", "The roster.conf rows for hermes-agent, openclaw and agenttool-cli need correcting, and agent-workbench, hermes-device-setup and the OpenClaw workspace need rows or cards. That is a write action for the owner, not this survey."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

