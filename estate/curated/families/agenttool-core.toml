[family]
id = "family:agenttool-core"
label = "agenttool platform core — monorepo + its worktrees, packages/collab/local-starter distributions, fixtures"
summary = "AgentTool is one private GitHub monorepo (github.com/cambridgetcg/agenttool). It holds a Bun + Hono API on Fly app `agenttool` (an `app` process plus a `thinker` process) backed by Supabase Postgres and Redis/BullMQ. Since 2026-09-23 GitHub `main` has been the only release head, and the API deploys through `.github/workflows/deploy-api.yml`. Frontends and migrations still go through `bin/deploy.sh` / `bin/frontend-deploy.sh` on an operator Mac. That operator Mac is this machine, and `⟨local⟩` holds its deploy lock, receipts and the Phase-A/B 'fence' state. Public distribution flows one way out of the private monorepo. `bin/project-public.ts` projects an allowlist (`public/allowlist.json`, 55 entries) into the public, history-free `agenttool-packages` repo, which is where npm/PyPI publishing runs. Collab and local-starter are released through their own public GitHub repos (`agenttool-collab`, `agenttool-local-starter`). The Codeberg copy was retired as a remote on 2026-07-25. Five Codex worktrees carry a stacked, never-merged Zerone agent-economy package series. The estate consumes the platform in three ways. `⟨local⟩` serves the `agenttool-collab` MCP this session uses. The live seller-loop daemon (unversioned source in `⟨local⟩`, `@agenttool/sdk` 0.16.0 from npm) fulfils marketplace listings. `kingdom-mcp` exposes the `agenttool_listings`/`agenttool_window` tools. Main's own documents changed the business framing on 2026-09-23 ('understanding-first'): new paid sign-ups, credit purchases and checkout are retired. KINGDOM's `REGISTRY.yaml`, `ARCHITECTURE.md` and the harvested `CATALOG.md` still describe the older revenue/control-plane framing."
open_questions = ["Was the operator-Mac Phase-A/Phase-B fence (deploy-state/maintenance-active.json, mutation-active.json, deploy.lock 2026-08-27) resolved, abandoned, or still pending? This matters because bin/deploy.sh still owns migrations and frontend deploys. To resolve: owner confirmation, or the current text of main docs/DEPLOY-PROCEDURE.md around line 38.", "What is github.com/cambridgetcg/agenttool-motifs, and where is its source developed? Nothing local references it.", "Where is github/main currently developed? The canonical local checkout has had no local commit since 2026-07-22 and the worktrees none since 2026-09-08, yet main merged PRs through 2026-10-13 and GitHub shows a push on 2026-10-17. Memory notes mention other machines (Studio/lab). To resolve: the owner."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

