[[project.corrections]]
field = "what / relationships / family_summary (publishing channel)"
verdict = "refuted"
corrected = "Only npm releases run from agenttool-packages (public/overlay/.github/workflows/publish-npm.yml; RELEASE_REPOSITORY in bin/npm-release.ts:29). PyPI still runs publish-pypi.yml in the private cambridgetcg/agenttool. pypi-release.ts:33 EXPECTED_REPOSITORY only sets the metadata URL, and SOURCE_REPOSITORY='https://github.com/cambridgetcg/agenttool'. docs/PYPI-RELEASES.md:58-73 records PyPI as 'Blocked while the source repository is private (2026-10-12)': the trusted publisher is bound to the private repo, a 0.23.0 dispatch would stop in prepare, and 'no such run was made'. Moving it needs Yu to add a trusted publisher for agenttool-packages. Whether PyPI agenttool-sdk 0.23.0 exists is therefore doubtful (the last recorded publish is 0.22.1)."
