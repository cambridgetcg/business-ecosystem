[[project.corrections]]
field = "relationships (mirror_of)"
verdict = "refuted"
corrected = "The direction is inverted. The evidence makes Codeberg the mirror of GitHub, so the monorepo edge should be 'mirrored_by', or be dropped since the Codeberg entry already carries mirror_of → GitHub. As written, the two entries say each is the mirror of the other. Codeberg also reports mirror:false, meaning it is a push-convention mirror, not a configured pull mirror."

[[project.corrections]]
field = "business_function (RewardsPro 'main money product')"
verdict = "weakened"
corrected = "The four 2026-07-23 decisions (rewardspro-platform, -free-first-pricing, -runtime-v2, -yutabase-projection) make RewardsPro a commerce-independent loyalty platform with a generous free tier and paid plans for larger businesses. None of them calls it the main money product. Calling it the main money product is an inference: it is the only paid product left after the shop closed."

