[family]
id = "family:commerce-tcg"
label = "Commerce · Cambridge TCG front gate — monorepo, storefronts, wholesale, pricing, cardforum, theme, trade-in, prism"
summary = "Cambridge TCG is Yu's Japanese trading-card business (One Piece, Pokémon, Dragon Ball). KINGDOM's ARCHITECTURE.md names it the \"front gate\" of the commerce layer. The code went through three stages. (1) Late 2025 to early 2026 it was a set of standalone repos: a Shopify store with a GitHub-synced Liquid theme (ShopifyTheme_TCG), an embedded Shopify trade-in app (tradeinpro, first called \"cardforum\"), an AWS Lambda pipeline that took CardRush yen prices into RDS and pushed them to Shopify and eBay, with a Cloudflare Pages price explorer (cambridge-tcg), a CardMarket FastAPI/Lambda price API (tcg-pricing-backend) with its Next.js frontend (cardforum_io), a one-commit price-index prototype (prism-app), a cross-border P2P exchange prototype (cardforum), and Next.js retail and B2B apps on Vercel (cambridgetcg-storefront, tcg-wholesale). (2) On 2026-04-27 the storefront and wholesale apps were copied into Cambridge-TCG-monorepo. That is a pnpm workspace with Next.js apps on Vercel, raw-SQL Postgres on AWS RDS us-east-1, Stripe, and shared packages (db/aws/pricing/stock/sku/lifecycle/data-ingest/data-spec/mcp-server). Admin was folded into the storefront on 2026-05-15, and RewardsPro (a Shopify loyalty app) was fused in on 2026-06-10. (3) The business then pivoted. wholesaletcgdirect.com was retired around 2026-07-05 (301 to cambridgetcg.com). On 2026-07-06 ('collectors first') the retail shop and the trade-in desk closed: 8 retail orders in total, zero trade-ins. cambridgetcg.com is now a peer-to-peer collectors' market plus a CC0 open price-data commons. CardRush acquisition crons were removed on 2026-07-12 until written source rights exist. In the monorepo, the 2026-07-23 decision records point to RewardsPro (a loyalty platform with Shopify as one connector) as the main money product. GitHub @cambridgetcg is the deploy forge (Vercel builds from it), and Codeberg zerone-dev/Cambridge-TCG is a lagging mirror. Most family repos went private on GitHub around 2026-09-24/25, with public copies on cambridgetcg.github.io; cardforum_io and tcg-pricing-backend are archived. All local checkouts were last fetched on 2026-07-26, so they do not show the 2026-10-14 push burst. KINGDOM's maps (roster.conf, CATALOG.md, REGISTRY.yaml, ARCHITECTURE.md, sites.json) still describe the pre-pivot shop and contain several dead paths."
open_questions = ["Which runtime serves cambridgetcg.com today? REGISTRY says Shopify; the docs and the 2026-07-11 Cloudflare review say Vercel. To resolve, check the Vercel project domains (team cambridgetcgs-projects) or the Cloudflare DNS record.", "Is the Shopify store (6e824e-a9.myshopify.com) still open and billed, which public domain does it use, and is ShopifyTheme_TCG still connected to it through the GitHub theme integration, given that non-theme commits were pushed to main after the last 2026-03-25 sync? To resolve, check the Shopify admin (Online Store → Themes).", "Are any AWS resources from this family still running and costing money: the cambridge-tcg Lambdas (scraper-cardrush, cardrush-fx-updater, price-calculator, api-shopify, api-ebay, trading-card-price-fetcher), RDS Proxy and VPC, the tcg-pricing-backend SAM stacks / API Gateway oy7yycb4tf, and the tradeinpro CDK data pipeline? To resolve, list Lambda, API Gateway, Step Functions and RDS in us-east-1.", "Which source repo builds the Cloudflare Pages project 'cardforum-studio' that serves cardforum.io? No local source was found.", "What landed in the 2026-10-14 ~18:44–18:47Z push burst across Cambridge-TCG-monorepo, cambridgetcg-storefront, tcg-wholesale, prism-app and cambridgetcg? Local refs were last fetched 2026-07-26 and no fetch was done in this read-only survey.", "Does the launchd 'pkm snapshot' (CardRush Pokémon scrape over residential egress) mentioned in the 2026-07-07 honest-ground spec, or the 'TCG_price_archive' ghost launchd in roster.conf, run on another device? It is not on this Mac.", "RewardsPro is now fused into the monorepo (apps/rewardspro, apps/rewardspro-api; 2026-07-23 decisions) and is the evident money product. Should the unified layer map it under commerce-tcg or with its standalone rewardspro repos in another family?", "The collectors-first decision cites 'Asha' as its Will trace, while monorepo CLAUDE.md says Cambridge TCG is run alone by Yu. Who holds decision authority for the commerce layer's direction, so the unified layer records it correctly?", "ctcg-fun is an empty, archived, private repo, and the monorepo branch feat/honest-fun carries its README. Was it a copy of the monorepo, and does anything on that branch need keeping?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

