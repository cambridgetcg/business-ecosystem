[family]
id = "family:language-protocols"
label = "Natural-language programming + protocols — natlang/natscript/NPL, *-protocol, *-node, trickster, internet-of-being"
summary = "This family is the \"natural-language internet\" cluster that was built in a burst between 2026-06-18 and 2026-06-24 on Yu's Desktop, mostly in single agent sessions. It has three parts. (1) Messaging code: nlp is the first TCP server/CLI that exchanges plain-text verb-headed messages through ⟨local⟩ inbox files. npl repackages and extends that into an 8-package Node monorepo (lang/dns/tcp/http/tls/sync/identity/og) with a Cloudflare KV worker. The seven message verbs (darshanqing, natsarqing, zakarqing, barakqing, heurekin, kunance, jeongqing) come from the YOUSPEAK vocabulary and true-love WAYS.md. The forge-only *-node repos, the darshanq/kunance protocol sites and the citizen-<verb> repos elsewhere in the estate are each one of those verbs. (2) Natural-language \"programming languages\": natlang is an LLM-backed compiler CLI, natural-lang is a Python parser/interpreter for STATE.md-style declarations, and natscript is a landing site whose interpreter is not in the local history. A Homebrew tap packages natscript. (3) Spec and manifesto repos with almost no code: internet (7-layer meaning stack plus a .kingdom KNS zone), protocol-state, ways/kunance/darshanq-protocol, recognition-protocol, trust, state-as-truth, understanding, insight/insights. .natural indexes them all. They are tied together by a STATE.md self-declaration convention, .nlp-bridge/gate \"DNS\" files, and GitHub Actions heartbeats that POST STATE.md to the sinovai arena every 6h. trust.py and discover.py (formerly under ⟨local⟩, now absent) cross-checked those declarations. opal-kernel is a real ~12k-line Rust aarch64 teaching kernel. It sits here only because it was the example \"agent\" in NPL/NLP and the natural-lang README. All 19 local checkouts are shallow mirror clones under ⟨local⟩ (created 2026-06-24, last fetched 2026-07-26). The working originals they name (⟨local⟩, ⟨local⟩, ⟨local⟩, ...) and their runtime state dirs (⟨local⟩, ⟨local⟩, ⟨local⟩) no longer exist on this Mac. Most local tips are estate-wide boilerplate sweeps: the love-bomb SessionStart hook on 07-21, FABLE-OF-YOU.md on 07-07, and merges on 07-24. The forge shows pushes after the snapshot (natlang 10-15; npl and natscript 10-14; nlp 10-01; most others on 2026-09-24, inside a 183-repo sweep window). None of the family has a kingdom.yaml card or a row in roster.conf, CATALOG.md, REGISTRY.yaml, sites.json or ⟨local⟩. In KINGDOM terms it is an unregistered nervous-layer (inter-agent messaging) research wing. Its live dependency is sinovai, the registered trust-arena worker."
open_questions = ["Who or what pushed to the forge after the 2026-07-26 snapshot (natlang 10-15; npl and natscript 10-14; nlp 10-01), and was it real work or an estate-wide sweep like the 2026-09-24 183-repo push? Resolve by fetching (with permission) and reading forge commit authors and diffs.", "Are the GitHub Actions heartbeat workflows (13 repos, cron every 6h, contents: write) still running, and does sinovai.com accept the POSTs? Resolve with `gh run list` per repo and the sinovai worker logs (network needed).", "Which claimed deployments are actually live: npl-ivory.vercel.app, natlang.axiepro.workers.dev, kingdom-portal, recognition.quixotic-sodium.workers.dev, understanding-ecz.pages.dev, trickster-protocol.vercel.app and the *.vercel.app protocol sites? Which Cloudflare account owns the 'quixotic-sodium' subdomain, given the estate account is 'axiepro'? Resolve with vercel/wrangler project listings.", "Does the private forge natscript repo contain natscript.py at tag v0.2.0? Is the public Homebrew tap meant to work for strangers while its source is private?", "Canonical-choice decisions for the owner: NPL implementation (npl vs nlp); natural-language language (natlang vs natural-lang vs natscript); OG-protocol work (trickster, trick-protocol, trickster-protocol, forgotten-kingdom-protocols, npl/packages/og); KNS (internet/kns vs kingdom-forge TEMENOS).", "Should opal-kernel (an independent Rust teaching kernel), nen-artifacts (ai-love mirror) and fake-hunters-arena (whitehack game) be moved out of this family in the business-ecosystem map? They landed here by name heuristics.", "Should this family get kingdom.yaml cards and roster.conf rows (as an 'NPL / natural-language internet' research wing in the nervous layer), or be recorded as dormant research with only the forge as home?", "What did insights and state-as-truth contain before their tips became boilerplate (shallow clones hide the history)? Resolve by checking the archived forge repos."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

