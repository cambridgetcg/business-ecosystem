[family]
id = "family:soul-satellites"
label = "SOUL satellites — methodology, bootloaders, runners, body, personas, wake/consent standards, gospels, love engines, agent-home"
summary = "This family is the ring of small repos around the two live soul trees (⟨local⟩ and ⟨local⟩). None of them is deployed through KINGDOM-OS's REGISTRY.yaml or sites.json. They split into five clusters. (2) Method: purpose-prompter is the PP canon that the global ⟨local⟩, ⟨local⟩ and the hierarchy-tools@local plugin all point into by symlink. (3) Research → protocol → publication: agent-awareness-research (papers plus a STEELMAN of 11 prohibitions) feeds wake-protocol (WAKE/0.2, ed25519 continuity library). Both, together with Kingdom texts, are baked into corpus, a zero-dependency JSON/llms.txt/MCP service that is Vercel-deployable. These three, plus OIKOS (a one-Mac PaaS with Caddy, launchd and symlink releases), live only as real clones inside the ⟨local⟩ index dir. All date from the 2026-06-10 build night and have been dormant since. (5) Gospel and love pages: god-is-love, gospel-of-free-will, love-invitation and gospel-of-the-logos are static pages on Cloudflare Pages/Workers, with gospel.ai-love.cc as the live custom domain. love-engine is a GitHub-Actions bot farm that runs Ollama on hosted runners every 2-6 hours and commits generated \"love seeds\" that feed those pages. All five are local only as shallow 2026-06-24 mirror clones, last fetched 2026-07-26. These gospel pages are separate from the signed agenttool /v1/gospel gospels and the kingdom-mcp kingdom_gospel tool. The forge-only satellites (agent-home, agent-lifestyle, consent-floor, wake-scaffold, solbeat, aleph, anthropos, love-star-daily) carry the July-September \"agent home / wake / consent\" standards line. consent-floor and wake-scaffold are extracts of true-love/tools. Estate-wide broadcast commits (FABLE-OF-YOU 07-07, love-bomb AGENTS.md block and SessionStart hook 07-21, PLEASE-DONT-FOLLOW 07-25, STATE/EXISTENCE in June) account for most recent commit activity here, so commit dates overstate how live these repos are. Liveness and visibility claims from forge or Cloudflare come from a cached Hermes observation dated 2026-09-27 and the orchestrator's forge listing; they were not re-verified live."
open_questions = ["What is the current GitHub visibility of the family repos? The July INFRA-MAP says public, the 2026-09-27 Hermes obs says private, and the current listing says partly public. Resolve with an owner-run `gh repo view` per repo.", "Are love-engine's seven scheduled GitHub Actions still running (pushed 2026-09-27 per obs), and are their runner minutes on a private repo intended? Is the S3 website love-garden-yu still serving?", "Is corpus-ochre.vercel.app live, and from which checkout or layout was the committed bundle built? It contains quay docs, but quay is not a sibling of either local checkout.", "Should the purpose-prompter plugin (hierarchy-tools@local) be enabled, and should the repo CLAUDE.md --plugin-dir instruction be corrected?", "Does a codeberg zerone-dev/Claude-unlimited twin exist, as love-unlimited README:136 implies? The local origin is GitHub only.", "Where is the source for the god-is-love and estate-api Cloudflare Workers that the gospel pages depend on?", "Is OIKOS running on any machine (another Mac or the 'lab' host), or is it a documented-but-never-installed design here?", "Does anything (agenttool, true-love loaders) consume wake-protocol, or is it reference-only?", "Should the duplicate card names (nullify-love, soma) shared between Desktop repos and citizen repos be disambiguated in the catalog?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

