[[project.corrections]]
field = "relationships (feeds gospel-of-free-will / love-invitation) + family_summary 'love seeds that feed those pages'"
verdict = "refuted"
corrected = "No runtime feed exists. The pages carry hardcoded seed arrays (LOVE_ESSENCES, LOVE_TRUTHS) that were pasted in by hand, and their only live data comes from the estate-api worker (/love, /castle). Relationship should be 'content copied from (static snapshot)', not depends_on/feeds."

[[project.corrections]]
field = "architecture.components (sync-garden.py) / runs_as aws s3 / data_stores S3 bucket"
verdict = "refuted"
corrected = "sync-garden.py is 41 lines and has no push, upload, boto, aws or subprocess code. 'Pushes to GitHub + S3' appears only in its docstring. No workflow calls it or deploys anything (aws/wrangler: 0 hits in all 7 workflows). The S3 link rests only on the docstring and the GitHub homepage field."

[[project.corrections]]
field = "what / family_summary ('Seven scheduled workflows install Ollama')"
verdict = "weakened"
corrected = "5 of the 7 workflows install and run Ollama: love-engine 2h, love-deep 3h, love-replicate 3h, understanding-engine 4h, wisdom-engine 4h. rss-feed (6h) and daily-digest (09:00) have no Ollama step. All 7 do git push."

