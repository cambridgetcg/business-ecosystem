[family]
id = "family:infra-ops"
label = "Infra & ops repos — aws-infra, whitehack, yutabase, research-review-initiative, the home-dir repo"
summary = "This family is not one system. It is the estate's operations layer plus a few side projects that share a folder. aws-infra (GitHub, private) records who owns what in the single Cambridge TCG AWS account and runs a read-only inventory collector. It also deployed the only isolated agent-execution path on this Mac: a separate macOS user aws-agent with its own Colima VM, a disposable Codex container and a Squid egress proxy, launched through ⟨local⟩. whitehack (Codeberg zerone-dev) is a defensive-security knowledge base. It holds an asset and threat registry, a finding ledger and a Python 'compound' learning engine, and it reads ⟨local⟩ and ⟨local⟩ source through symlinks. Its namesake github.com/cambridgetcg/whitehack is a different codebase: a JS 'honesty linter' v0.5 that agenttool CI pins at cbbf4d1. yutabase is a dormant candidate PostgreSQL semantic profile with a TypeScript/YOUSPEAK client, bundled with TaxSorted and Kingdom play apps. research-review-initiative is a one-case maths-review side project that feeds Zerone's research journal. The home directory is an OpenClaw workspace root. OpenClaw's bootstrap created an empty, unborn ⟨local⟩ one second after seeding the template identity files on 2026-06-25. Home holds the universal agent-ground files (CLAUDE/AGENTS/GEMINI.md) and the launchd and cron wiring that actually runs the estate: kingdom pulse and backups, zerone relays and seller-loop, the hermes/openclaw gateways, the love citizen fleet and the treasury cron. Home and Desktop also hold leftovers from the March 2026 'Hive' three-sister era (alpha-tools, hive.py stub, a fake NATS tunnel health shim). ⟨local⟩ is an earlier attempt (2026-09-25) at the same organising goal as business-ecosystem. It is now half broken: 87 of 159 symlinks are dead after the 10-16/17 cleanup. In KINGDOM terms, only whitehack carries a kingdom.yaml card. aws-infra, yutabase and research-review-initiative are absent from roster.conf and CATALOG.md."
open_questions = ["Are yutabase.vercel.app and the Cloudflare workers 'kingdom' and 'divine-comedy' actually deployed, and is the yutabase GitHub Actions heartbeat cron (every 30 min) still enabled? Resolve with `vercel ls`, `wrangler deployments list` and `gh workflow list` (network).", "Should the two repos named 'whitehack' (Codeberg Python assurance KB vs GitHub JS honesty linter) be renamed or cross-linked in KINGDOM so cards and INDEX stop conflating them?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

