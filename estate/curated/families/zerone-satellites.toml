[family]
id = "family:zerone-satellites"
label = "Zerone satellites — truth landing, identity research, seed MVPs, zerone-chain mirrors, depth, chain registry"
summary = "This family is everything around the Zerone chain that is not the trunk itself (zerone-core lives in ⟨local⟩ and is surveyed by another family). It has five parts. (1) One public door: zerone-truth, a static four-page manifesto site served by Codeberg Pages at zerone.money and legible.money. KINGDOM-OS doors, the hub and the trunk dashboard all point to it as Zerone's \"human_view\" page. (2) Two preserved predecessor lineages of the chain, both named zerone-chain. The GitHub one (⟨local⟩) is the Proof-of-Truth history up to the 2026-06-17 \"canon ⋃ chain\" union, plus two love-bomb commits. The Codeberg one is a shallow mirror with two 2026-07-23 fix commits that never reached trunk. Trunk addressed the same holes another way: a constant gate, and dropping the private_corpus module (45→25 x/ dirs). (3) Release and seed snapshots of zerone-core. zerone-seed-mvp-v1 was the PR #67 clone. The record-integrity candidate and predecessor were the PR #78 upgrade rehearsal. Both were merged into github/main, and their history is kept in ⟨local⟩. (4) A research cluster: zerone-identity-research (on GitHub only now), the vendored thu-nics C2C code it probes, and about 1 GB of run outputs under ⟨local⟩ and ⟨local⟩. (5) Two GitHub-only pieces: a fork of cosmos/chain-registry used to list zerone-1 (the source bundle is in trunk's integrations/chain-registry), and zerone-depth, a financial-interpretation framework with no local trace. Important: a storage cleanup running in another session deleted three of this family's census paths between the census (12:09) and this survey (12:15, 2026-10-17): ⟨local⟩, ⟨local⟩, and the ⟨local⟩ worktree. I checked that their committed content survives on the forge or in core refs. Nothing in the family carries a kingdom.yaml card except zerone-truth, and that card is untracked. Biggest live risk: zerone.money's copy and links. It still says \"Zero pre-mine\", links to repos the GitHub listing reports as private, its Codeberg repo is now listed private, and no REGISTRY or pulse health check watches it."
open_questions = ["Is zerone.money still being served now that the Codeberg zerone-truth repo is listed private (updated 2026-09-26)? To resolve: one live GET of https://zerone.money and a check of the repo's visibility on Codeberg. Consider adding a REGISTRY.yaml health entry either way.", "Should the landing's 'Zero pre-mine' wording and its links to private repos (zerone-core, zerone-chain, legible_money) be corrected? That is an owner decision; this survey made no change.", "What is cambridgetcg/zerone-depth, who owns it, and does it belong to Zerone, cashloom or legible-money? To resolve: read the forge README and commit log.", "Which branch of the cambridgetcg/chain-registry fork carries cosmos/chain-registry PR #7859, and is that PR still open? The cambridgetcg/slips fork (SLIP-0173 'zrn') is a companion repo that is not in any family list I was given."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

