[family]
id = "family:agenttool-services"
label = "agenttool split services + satellites (identity/memory/vault/... dashboard/docs/infra/landing/sdk-py, go-to-market, seed MVP)"
summary = "This family is the March-2026 \"split\" generation of agenttool: nine single-purpose HTTP services (identity, memory, vault, trace, economy, pulse, tools, verify, bootstrap), plus a static landing site, a docs site, a dashboard, an infra-scripts repo, a Python SDK and a go-to-market campaign repo."
heavy = true
open_questions = ["What did the 2026-07-29 pushes to all 14 archived GitHub repos contain? Local clones last fetched 2026-07-26. Resolve with a fetch (network) or gh api.", "Is the Cloudflare Worker 'agenttool-waitlist' (route agenttool.dev/api/*, KV WAITLIST) still deployed? Do the old Cloudflare Pages projects for landing, docs and dashboard still exist? Resolve with wrangler deployments/pages list (network).", "Are the Hetzner 'Forge' server and any pre-Fly Postgres/Redis still running and billing? The 2026-05-09 audit covered Fly only. Resolve in the Hetzner console.", "Was the agent-identity DID bridge (origin commit 48cb981, 2026-06-18, did:at<->did:lgm for Legible Money/CashLoom) ported anywhere? It is absent from agenttool github/main and sits on an archived repo.", "The consolidation commit lists packages/sdk-ts among the 15 absorbed repos, but no standalone agenttool-sdk-ts appears in the cambridgetcg forge listing or on disk. Was it deleted or renamed? Resolve with gh api or the GitHub audit log."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

[family.sphere]
value = "kingdom-os"
evidence = "Retired split-generation predecessors of agenttool; their cards say layer nervous."
source = "classification-2026-10-17"
reviewed = false
as_of = 2026-10-17
review_after = 2027-01-15

