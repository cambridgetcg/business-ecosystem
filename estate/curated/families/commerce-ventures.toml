field = "kingdom.drift / drift[1]: 'cashloom is the exception: its card is tracked'"
verdict = "refuted"
corrected = "On local main the card is untracked AND gitignored. 'git ls-files kingdom.yaml' is empty, 'git check-ignore -v' points to .gitignore:31, and the file's mtime is 2026-06-18. Only origin/main tracks a (different) card, added in 04bb2b3 on 2026-07-30. New risk: Git treats ignored files as expendable, so merging origin/main into main would silently overwrite the local card."

