[family]
id = "family:commerce-ventures"
label = "Commerce · standalone ventures — RewardsPro, AxiePro, taxsorted, cashloom, fomoengine/fomoscan, captioneer, rhetorlint, saas-marketing"
summary = "These are Yu's standalone commercial products. They do not share a codebase. They are tied together by the KINGDOM catalog (roster.conf, kingdom.yaml cards, REGISTRY.yaml, sites.json) and by a few live service links. Four are live public services today, each with its own runtime. TaxSorted is a Hono+Postgres API on Fly (taxsorted-api) with a Next.js static site on Cloudflare Pages. CashLoom's info-server.ts runs as the MONEYWORLD fact door on Fly (cashloom-api), with cashloom.io on Pages (cashloom-atlas). The fomoscan detector runs at api.fomoengine.io on Fly and charges $0.01 USDC per /scan through x402. The 'authenticity shield' Next.js app on Vercel serves the fomoengine.io apex. These four were reported up by the cached pulse at 2026-10-17T11:13Z. The links between them: rhetorlint-spec publishes the @rhetorlint/* npm packages that fomoscan bundles. kingdom-mcp's fomo_scan and money_* tools call fomoscan and cashloom-api over HTTP. The agenttool seller-loop imports ⟨local⟩ by absolute path. A launchd job (com.kingdom.loom-snapshot) pulls cashloom-api every day into Tigris. No code has changed on any of them since June 2026. Captioneer (the JA→Cantonese dubbing pipeline) and the two saas-marketing repos are archived on GitHub. The captioneer.io brand now serves a different reader whose source is not on this machine. Across the family, the local checkouts lag the forge. Every repo was last fetched on 2026-07-26, and most forge repos were pushed again on 2026-09-24 or 2026-10-14. The kingdom.yaml cards are untracked local files in 9 of the 15 repos. Several cards and roster lines describe products that have since pivoted (cashloom, fomoengine, captioneer)."
open_questions = ["Which repo and source build captioneer.io (CF Pages project 'captioneer-read')? Candidates are github mynameisyou-cmyk/captioneer (linked from cashloom WAKE.md) and cambridgetcg/open-lens. Checking the Pages project's source settings would resolve this.", "RewardsPro: is the Vercel app (rewardspro-production.vercel.app / Shopify handle RewardsproMembership) still serving installed merchants, and is rewardspro.io still served by CF Pages rewardspro-landing? Check the Vercel deployments and the Shopify Partner dashboard. Do the 461 rewardspro-shopify-only commits contain work that never reached production?", "Every local checkout in this family was last fetched 2026-07-26 (fomoscan 07-23). The forge shows pushes on 2026-09-24 and 2026-10-14 for cashloom, fomoengine, taxsorted.io, rewardspro-production, rewardspro-shopify, AxiePro and rhetorlint-spec. Their content is unknown locally until an owner-run fetch.", "Should the untracked kingdom.yaml cards (10 repos) be committed, and with which corrected purpose/state? Should rhetorlint-spec, fomoscan and the github 'rewardspro' dev repo get cards and roster rows?", "rhetorlint: is the npm Trusted Publisher (OIDC) now configured, and was rules-en 0.1.1 deprecated? Memory said both were pending as of 2026-07-25, and this cannot be verified without network access.", "taxsorted-studies and cashloom-aws are forge-only. Is taxsorted-studies deployed anywhere? Was the cashloom-aws Terraform ever applied to an AWS account?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

