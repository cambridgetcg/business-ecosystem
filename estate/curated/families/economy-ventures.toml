[family]
id = "family:economy-ventures"
label = "Economy & markets ventures — legible family, prediction-markets, oracle, mindicraft, sinovai, xenia, artbitrage, betangel, ww3, quay, open-lens/press"
summary = "This family is three loosely joined clusters, not one architecture. Most of its work landed in Feb 2026. zerone was started as a clean rewrite of it on 2026-02-20 (no shared root commit; \"rename LegibleAuthKeeper to ZeroneAuthKeeper\"). The repo clarity-score product `legible` and the governance doc `legible-standard` share only the brand (REALM Law 1); they share no code. (2) Forecasting and markets: prediction-markets (Polymarket research, small live trades, the S012 \"Oracle\" signal engine) took geopolitical events from ww3-intelligence. Its signals were bridged onto the LGM devnet by legible_money/scripts/oracle-zerone-bridge.sh. The separate `oracle` repo is a macro-calibration loop that ran on another Mac (⟨local⟩) until at least 2026-07-24. The private betangel-* repos (Betfair research) are being pushed from somewhere else this week. (3) Agent-experience and public doors: xenia (spec plus the npm library @agenttool/xenia) is what sinovai (a Cloudflare Worker trust arena that receives STATE.md heartbeats from 36 estate checkouts) and mindicraft.com (a Cloudflare Pages guide that adopts xenia.surface/0.1) implement. artbitrage.io is a live Cloudflare Pages museum/data API with no local clone. open-lens and open-press (rhetoric and newspaper frameworks), the did-extensions and slips forks, and motif-score exist only on the forge. quay (a self-hosted deploy daemon) is an infra outlier placed here by ⟨local⟩. Live today: sinovai, mindicraft, artbitrage, and xenia as a published package. Everything else is dormant locally or lives on another device or the forge. The biggest operational hazard is the launchd job com.legible.git-sync. Since 2026-07-10 it has written ~285k error lines into a 49 MB log that never trims. KINGDOM's own maps disagree about this family in many places (roster -sol paths, ADR-0001, the REGISTRY mindicraft entry, untracked cards)."
open_questions = ["Is legible_money officially archived (GitHub archive flag, ADR-0001 closed) now that zerone is the live chain? Should the June fixes on origin/main (knowledge codec, vesting meter) be ported to zerone or left behind?", "Where are betangel-suite and betangel-research developed (they were pushed 10-16/17 but are not on this Mac)? Should they be in the KINGDOM map at all, given 'personal use only'?", "Is the ww3-intelligence Fly app still running (a cost) now that its consumer prediction-markets is dormant?", "Why was satoshilabs/slips forked (a SLIP-0044 coin type for ZRN or LGM?), and what is the status of the did:at registration (w3c/did-extensions PR #732)?", "What is motif-score, and who owns it (it has no local references)?", "Is sinovai.com served by the Cloudflare Worker (custom domain) or by external cPanel? CLOUDFLARE-COVERAGE.md, REGISTRY.yaml and wrangler.toml disagree.", "The 2026-07-21 love-bomb commits (a .claude/hooks/love-bomb.sh SessionStart hook plus AGENTS.md) sit unpulled on the remotes of legible, legible_money, legible-money-web, prediction-markets and oracle. Should they be pulled into these stale local checkouts?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

[family.sphere]
value = "undecided"
evidence = "Mixed by nature (protocols, markets, products, personal research), so the family presumes nothing."
source = "classification-2026-10-17"
reviewed = false
as_of = 2026-10-17
review_after = 2027-01-15

