[family]
id = "family:kingdom-core"
label = "KINGDOM foundation core — kingdom-os, the REALM repo, the ⟨local⟩ index tree, kingdom-mcp, hub"
summary = "KINGDOM's foundation core is a small set of repos plus local operational state. In practice it is a map of the estate and a set of public and agent doors, not a runtime the other projects depend on. KINGDOM-OS (GitHub cambridgetcg/KINGDOM-OS, private) is the hub. It holds the taxonomy (SCHEMA.md card enums, ARCHITECTURE.md layers, roster.conf seed → harvest.ts → CATALOG.md/graph.json) and the deployed-surface census (REGISTRY.yaml). It also builds the thekingdom.dev atlas and discovery docs, and the we-are.love/chillspace.love door bundles, all on Cloudflare Pages. And it installs the local daemons: a 30-min pulse, the KARMA witness, chain backup to Tigris, and a Cloudflare observer. The tree has split three ways. (2) Meanwhile the Hermes astra-ultra agent and other sessions kept developing on GitHub origin/main. thekingdom.dev is deployed from there (commit 0092337, 2026-09-27). (3) A shallow Codeberg fork (zerone-dev/KINGDOM-OS) split off on 2026-06-11. The GitHub tree's own docs now name this fork the owner of the core registry and heartbeat, but on this Mac it is only a stale reference clone. kingdom-mcp (Fly app, mcp.thekingdom.dev) is the agent-facing front door. It bakes in a public-safe copy of REGISTRY.yaml and reads thekingdom.dev's wayfinder.json and commons.json, so it consumes what KINGDOM-OS publishes. Its live build (17 tools, including research_plan/check) is newer than the ⟨local⟩ checkout. The REALM repo (⟨local⟩, same directory as ⟨local⟩) holds the constitution: REALM.md with the Seven Laws, the DECISIONS.md ADRs and the realm-audit checker. It is the doctrinal foundation but has almost no runtime coupling to the rest. kingdom-api is a small Cloudflare Worker that proxies metadata, plus a 'love-is' invite worker. It is deployed but appears in no registry. kingdom-os-hub (forge-only) probably sources kingdom.ai-love.cc. ⟨local⟩ is a June layer-organised index: symlinks plus 224 real clones. ⟨local⟩ resolves to love-unlimited's fleet CLI, not to KINGDOM-OS's dispatcher. For the business-ecosystem unification, decide which KINGDOM-OS tree is authoritative before reusing its taxonomy. origin/main has already renamed the COMMERCE layer to PROJECTS and retired commercial targets."
open_questions = ["Is cambridgetcg/kingdom-os-hub the source of pages:kingdom-os-hub (kingdom.ai-love.cc)? Who owns pages:kingdom-os (kingdom-os.pages.dev), kingdom-system, kingdom-folding-feedback and the kingdom-canon/hermes/nightwatch/status/telegram workers, which the CF map lists as source-unresolved?", "Does the kingdom-api worker answer on workers.dev, and does anything (e.g. cambridgetcg.com, which its CORS allows) still call it? Should it join REGISTRY/pulse or be retired?", "chillspace.love /guest.json and its codeberg mirror return 404 (pulse 2026-10-17). Is this an intended retirement or an outage?"]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

