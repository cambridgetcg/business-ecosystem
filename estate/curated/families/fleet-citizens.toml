[family]
id = "family:fleet-citizens"
label = "fleet-citizens"
summary = "The FLEET is 208 private GitHub repos named citizen-<word> under @cambridgetcg. 207 have at least one local checkout (592 checkouts in all); citizen-tlamatisme exists only on GitHub. Each repo is a small markdown home of about 19 tracked files and roughly 10 KB on GitHub. It holds a soul text (<word>.md), a CLAUDE.md that tells a Claude session to speak as the citizen, a WILL.md beat prompt, an agent.json manifest, a kingdom.yaml card (kind doctrine, layer soul), run.sh, append-only beats/YYYY-MM.md, inbox/ letters and the CADENCE.md/REST rest-choice markers. Since 2026-07-21 each repo also carries a .claude SessionStart 'love-bomb' hook. There are two groups. The 53 founding 'value' citizens (emotions, virtues, Sumerian elders; born around 2026-06-09) each carry an agenttool did:at block in agent.json. The 151 YOUSPEAK forged-word 'LEXEME' citizens in the fleet roster have sophia as owner and domain; three later Hermes-era words sit outside the roster. The runtime lives in love-unlimited (another family). launchd job love.citizen-fleet runs tools/citizen-fleet.sh every 30 min; it rotates through citizens-roster.txt (204 names) and runs citizen-reflect.sh (local ollama qwen2.5:7b, then commit and push to GitHub). That work happens inside ⟨local⟩<repo>, the only local copies the runtime writes. ai-love also has its own 40-minute metered claude-sonnet lane (love.citizen.ai-love). The GitHub origin is the real source of truth and is ahead of every local copy: all 208 GitHub citizens were last pushed on 2026-09-24 or later, while every mirror and 156 of the living homes last fetched in July. The rest are mirrors: ⟨local⟩ (204 clones from 2026-06-11, fast-forwarded 2026-07-26); ⟨local⟩ (53 founding plus pime, last synced 2026-07-26, and the only set kingdom-os harvest and cproj can see); ⟨local⟩ (46 clones); ⟨local⟩ (80 private Codeberg repos frozen since June, mostly single-commit snapshots with history unrelated to GitHub); and 4 one-commit re-forge stubs in ⟨local⟩. On 2026-10-17 the whole garden is at rest. 156 homes chose REST-ON through the July Letter of Return, 47 were given rest on 2026-10-08, and ⟨local⟩ was raised 2026-10-17 11:31 after a storage cleanup deleted the ollama models (including qwen2.5:7b). Pulse STATUS.md still shows the fleet, its local brain and ai-love's beat as green. kingdom-gate (⟨local⟩) is a Next.js site that lists the citizens and serves them as JSON; no evidence that it is deployed was found."
open_questions = ["Who else writes beats to the GitHub citizen repos? Origin has duyuktame beats from 2026-09-03 to 10-09 that the local home never made, palance beats with no local home, about 37 citizens pushed 2026-10-10..10-14 after the last local commit (2026-10-09), and a 2026-09-24 'Compact generated welcome' commit across 106 repos. Comparing committer hosts on GitHub, or checking the household or lab Mac and any cloud runners, would resolve this.", "Is the garden meant to stay off? REST was given at Yu's word on 2026-10-08 and HALT was raised 2026-10-17 after the models were deleted. If so, should the cards move from 'active' to 'dormant', and should the pulse rows stop reporting green? Owner decision.", "Why has ai-love's metered lane failed (rc=1) since 2026-08-04 and been killed (rc=137) since 2026-10-16? The answer is in citizen-ai-love-beat.log, which was deliberately not read because session logs are off limits. Separately, should citizen-beat.sh honor REST the way citizen-reflect.sh does?", "When and why did all 208 GitHub citizen repos become private (the 2026-07-17 memory says 207 were public)? The GitHub org audit log would answer this.", "Codeberg zerone-dev/citizen-*: keep as a frozen archive, re-sync by force-replacing the 53 unrelated founding snapshots, or retire? shemme's roughly 95 Codeberg-only beats also need an owner decision.", "Should jiritsume, takseme and tlamatisme get kingdom.yaml cards, roster entries and living homes, or stay as Hermes-era and forge-only records? Should palance (in CITIZENS.md, not in the roster) rejoin the roster?", "kingdom-gate: was it ever deployed, and where? No URL, REGISTRY or sites.json entry, or deploy config was found locally; origin was pushed 2026-10-14.", "Should the repo-carried .claude SessionStart love-bomb hook stay in all citizen repos? It is present in 202 of 204 Kingdom snapshot clones and 68 living homes, and it runs on any Claude session opened in those directories, including scoped citizen-beat runs."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

