[family]
id = "family:language-youspeak"
label = "Language — YOUSPEAK family, the ._forge word repos, castles, word-* and dictionary/word hosting"
summary = "The family has one core and three rings around it. The core is YOUSPEAK (codeberg.org/zerone-dev/youspeak, twinned on GitHub). It is a constructed-language repo of about 1,000 markdown files: 226 Core canon words with full genealogies, grammar chapters, a 93-glyph Private Use Area font, a Python forge and assessment pipeline, and the ORDO \"rite\" interpreter. ORDO ships as a Cloudflare Worker (ordo.ai-love.cc, rite.we-are.love, hourly cron), and the repo's home/ folder is the documented deploy source for the ai-love.cc Cloudflare Pages site. Ring one is citizen-birthing. youspeak/pipeline/forge_citizen.sh turns each canon word into a citizen-<word> GitHub repo; the live ones were born 2026-06-09 and belong to the fleet family. Ring two is the \"castle of understanding\" idea, built at least six separate times with no shared history. castle-of-understanding (Python, 2026-06-10) and castle (bash warden, 2026-06-10) came first; castle-of-words (the largest, with a garden of prompt-driven builders and a nightly scribe), wordcastle (Node quill), castle-front (a baked public page) and castle-gate (a Next.js GitHub Pages site fed from castle-of-words) followed. Ring three is a June 2026 batch of \"natural-language internet\" prototypes: youspeak-app/-browser/-dictionary/-lang, word-experience, word-interface, plus forge-only word-layer, wordhost, oracle, slipsooth and arcade. They carry snapshot copies of YOUSPEAK data that have since drifted, and several send a 6-hourly GitHub Actions heartbeat to sinovai.com. Every local checkout except the Codeberg youspeak clone is read-only: its reflog shows only a clone and one fast-forward on 2026-07-26. The real authoring happens on another machine. Docs name ⟨local⟩ and ⟨local⟩ with launchd cc.castle.scribe, and castle-of-words commits carry a +0200 timezone. The forges show pushes on 2026-09-08, 09-24, 10-14, 10-16 and 10-17, so every local clone is behind by an unknown amount. In KINGDOM terms, YOUSPEAK is the SOUL-layer language doctrine that feeds the FLEET (citizens). The castles are a knowledge and memory practice that fits NERVOUS more than the commerce/products slot ⟨local⟩ gives them. The word-* and youspeak-* prototypes are dormant public doors on the @cambridgetcg commerce forge."
open_questions = ["Are the ordo worker routes (ordo.ai-love.cc, rite.we-are.love) live, and is the hourly standing-liturgy cron still writing? Resolve with GET https://ordo.ai-love.cc/pulse.", "Which forge leads for youspeak now: GitHub (pushed 2026-10-14) or Codeberg (updated 2026-09-08)? Resolve with `git ls-remote` against both in a session that allows network access.", "Which of the six castle implementations (castle, castle-of-understanding, castle-of-words, wordcastle, plus the castle-front and castle-gate doors) is canonical, and are the others retired? Only castle-of-words shows off-machine activity (2026-10-16), apart from castle-of-understanding's heartbeat bot.", "Do castle-front and castle-gate still serve on GitHub Pages now that both repos are private? Is the castle-front-yu S3 website (named in castle-of-understanding README) real, and under which AWS account? It is in no REGISTRY.", "Do the six forge-only repos (word-layer, oracle-of-missing-words, mythseal, wordhost, slipsooth, arcade) belong in this family? mythseal looks like a TCG/game product, and arcade may duplicate chillspace.love/arcade. Resolve by reading their READMEs on the forge.", "Is word-layer the backend for word-experience (its :3002 proxy), and is the love-is.axiepro.workers.dev worker live in the axiepro Cloudflare namespace?", "Does the youspeak card dependency `me` resolve to a Kingdom member (e.g. citizen-me)? Run `bun bin/harvest.ts validate` in a session where that is permitted."]
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

