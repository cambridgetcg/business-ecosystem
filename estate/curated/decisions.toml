# Owner decisions of 2026-10-17 (D1 to D8): Yu's answer to the atlas Questions for Yu, as the
# orchestrator settled its reading. The estate applies each effect on every build (tool/decisions.py)
# and never rewrites a curation file for it. The verbatim words are kept in the private curation.

[[decision]]
id = "dec-2026-10-17-2"
label = "D1"
date = 2026-10-17
kind = "owner-decision"
by = "yu"
subject = "Which KINGDOM taxonomy is authoritative"
decision = "The taxonomy follows GitHub: the main branch of github.com/cambridgetcg/kingdom-os (origin/main) is the authority. The local kingdom-os worktree is no longer a rival: where it differs, the estate follows origin/main and reports the difference as drift, with one kingdom-os proposal to reconcile the two. Layer labels come from the origin/main ARCHITECTURE box, where the commerce layer is labelled PROJECTS. The Codeberg KINGDOM-OS fork and the off-enum vocabularies are not authoritative. The estate still never fetches, so origin/main is as fresh as the last fetch in kingdom-os."
resolves = ["dispute:taxonomy-authority", "q:taxonomy-authority"]
basis = "The owner's answer of 2026-10-17 to the atlas questions."

[decision.outcome]
"dispute:taxonomy-authority" = "kingdom-os origin/main"
"q:taxonomy-authority" = "origin/main is authoritative and the worktree is shown as drift only; the Codeberg fork and the off-enum vocabularies (boot, kernel, registry, userland) are non-authoritative, proposals only"

[decision.effects]
taxonomy_ref = "origin/main"
drift_only = "worktree"
non_authoritative = ["codeberg.org/zerone-dev/kingdom-os, the Codeberg KINGDOM-OS fork", "the off-enum layer vocabularies (boot, kernel, registry, userland)"]

[[decision]]
id = "dec-2026-10-17-3"
label = "D2"
date = 2026-10-17
kind = "owner-decision"
by = "yu"
subject = "Citizen layer: soul or fleet"
decision = "Citizens are layer soul. Where a citizen's card says soul, or names no layer, and harvest's discoverFleet rule forces fleet on it, the forced fleet no longer contests the card: the citizen is soul, and harvest's fleet stays visible as a claim. One kingdom-os proposal carries a patch preview that makes discoverFleet honour the card layer, soul when a card has none."
resolves = ["dispute:citizen-layer", "q:citizen-layer"]
basis = "The owner's answer of 2026-10-17 to the atlas questions."
stays_open = ["A citizen whose card names a layer other than soul is not covered: it stays contested between its card and harvest's fleet, and whether such a card should say soul is not decided."]

[decision.outcome]
"dispute:citizen-layer" = "soul"
"q:citizen-layer" = "citizens are layer soul, as their cards say"

[decision.open]
"q:citizen-layer" = "Should the fleet stay at rest, or resume by pulling qwen2.5:7b and removing HALT?"

[decision.effects]
layer_overrule = "harvest:fleet"
layer_default = "soul"

