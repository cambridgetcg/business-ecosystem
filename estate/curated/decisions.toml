[[decision]]
id = "dec-2026-10-17-5"
label = "D4"
date = 2026-10-17
kind = "owner-decision"
by = "yu"
subject = "What KINGDOM OS is"
decision = "KINGDOM OS is the civilisation, not one repository: every civilisation-related repository, and several Cloudflare domains, are part of it. github.com/cambridgetcg/kingdom-os remains its connective map (roster and harvest); the Codeberg KINGDOM-OS fork and the REALM repository (github.com/cambridgetcg/kingdom) are members, not rivals."
resolves = ["dispute:kingdom-os-claimants", "q:kingdom-os-identity"]
basis = "The owner's answer of 2026-10-17 to the atlas questions."
stays_open = ["dispute:adr-0001: whether legible-money stays canonical or the live zerone-1 chain supersedes it.", "Every record the sphere facet holds as undecided (evidence mixed or absent, or third-party code), listed for Yu in the atlas."]

[decision.outcome]
"dispute:kingdom-os-claimants" = "all three are part of KINGDOM OS: github.com/cambridgetcg/kingdom-os is its connective map; codeberg.org/zerone-dev/kingdom-os and github.com/cambridgetcg/kingdom are members"
"q:kingdom-os-identity" = "KINGDOM OS is the civilisation, the umbrella; kingdom-os is its connective map"

[decision.open]
"q:kingdom-os-identity" = "Should ADR-0001 (legible-money canonical) be closed as superseded by the live zerone-1?"

# The sphere facet (kingdom-os, independent, undecided) for projects, zones and surfaces. Curated
# assignments come from the evidence-backed classification of 2026-10-17 (reviewed = false); this
# rule of thumb places only what no assignment names: the KINGDOM layers are part of KINGDOM OS and
# the commerce layer (PROJECTS) is independent.
[decision.effects]
sphere_by_layer = { soul = "kingdom-os", runtime = "kingdom-os", nervous = "kingdom-os", fleet = "kingdom-os", economy = "kingdom-os", os = "kingdom-os", commerce = "independent" }

