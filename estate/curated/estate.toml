[[upstream_note]]
id = "note:pulse-exit3-semantics"
owner = "kingdom-os"
repo_id = "github.com/cambridgetcg/kingdom-os"
file = "bin/pulse.ts"
title = "Let pulse tell a degraded job from a failed one"
text = "chain-backup exits 1 on an operational failure and 3 when it captured data it did not verify; pulse reports any nonzero launchd exit as down, so the two look the same. Exit 3 is not a success and should stay visibly not green; a distinct degraded (amber) state would separate it from a hard failure."
status = "proposed"
as_of = 2026-10-17
review_after = 2027-01-15
reviewed = false
source = "survey-2026-10-17"

