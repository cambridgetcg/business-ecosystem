# W5: both sides are on main, and .github/workflows/wire-e2e.yml runs the wire end to end, so it is
# wired. It stays designed until a run of that workflow on main is green: then set stage = "demonstrated"
# (demonstrated_by already names it) and build with --forge, which reads that run to confirm it.
[[wire]]
name = "sale-to-ledger"
from = "pkg:github.com/cambridgetcg/business-ecosystem//operational/commerce-intake"
verb = "feeds"
to = "pkg:github.com/cambridgetcg/business-ecosystem//foundational/accounting"
channel = { kind = "file", name = "events.ndjson of commerce.sale.recorded and commerce.sale.refunded, version 1" }
anchors = [
  { side = "from", path = "operational/commerce-intake/src", text = "COMMERCE_SALE_RECORDED" },
  { side = "to", path = "foundational/accounting/src/commerce_posting/contract.py", text = "commerce.sale.recorded" },
]
code_state = "wired"
stage = "designed"
flow = "sale-to-ledger"
hop = 1
demonstrated_by = "wire-e2e.yml"
evidence = "The first wire of the plan: synthetic sales through the commerce-intake CLI's events.ndjson into the accounting ledger, both on main, run end to end by tests/wires in wire-e2e.yml. Not demonstrated yet: no run of that workflow on main can be green while the account's GitHub Actions budget stops every job. Synthetic data only until Yu answers the prerequisites."
source = "capability-2026-10-19"
reviewed = false
as_of = 2026-10-19
review_after = 2027-01-17
