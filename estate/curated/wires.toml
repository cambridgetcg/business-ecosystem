# Curated wires (tool/wires.py): what connects the business's packages and repositories, kept as
# relations. One [[wire]] row per wire: from feeds to (or from depends_on to) over a channel, with
# anchors, each a repository-relative path (a file, or a directory and everything under it) and a text
# that every build re-finds in the tracked files of that side's checkout, comments stripped.
# code_state and stage are this row's claim; the build measures both and `estate check --wires`
# compares them (exit 1 when a wired claim has no consuming code, 10 when another state differs).
# A designed wire may name an end that is not built yet. Hand-edited; rows written by an agent read
# reviewed = false until Yu reviews them. Only forge ids, package ids, repository-relative anchors and
# short evidence belong here.

[[wire]]
name = "compliance-status"
from = "pkg:github.com/cambridgetcg/business-ecosystem//operational/data-privacy"
verb = "feeds"
to = "pkg:github.com/cambridgetcg/business-ecosystem//operational/.orchestration/compliance"
channel = { kind = "http", name = "GET /api/v1/compliance-status/:entityId" }
anchors = [
  { side = "from", path = "operational/data-privacy/src/routes/index.ts", text = "'/compliance-status/:entityId'" },
  { side = "to", path = "operational/.orchestration/compliance/src/index.ts", text = "/api/v1/compliance-status/" },
]
code_state = "wired-unbuilt"
stage = "designed"
evidence = "The only HTTP route both sides match: data-privacy serves it and the compliance aggregator calls it. Both packages are build-quarantined."
source = "capability-2026-10-19"
reviewed = false
as_of = 2026-10-19
review_after = 2027-01-17

