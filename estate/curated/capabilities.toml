# The business capability map (vocab/facets.toml [business.capability]): one row per project, keyed by
# forge id. Written by `estate capability --import ABS_PATH --write`, which merges by id, keeps every row
# with reviewed = true, and renders this file anew (comments other than this header are not kept).
# impl, operating and serves name values whose reading a row states; the others read impl code,
# operating unknown, serves self. operating is a claim as of the row's as_of. A row with no values says
# the project has no business capability. Local ids and the full evidence of every row live in
# private/curated/capability.toml.

