[[motif]]
name = "transactional-outbox"
pattern = "An event is stored in the same database transaction as the change it reports, and a relay publishes it from there."
libraries = ["pkg:github.com/cambridgetcg/business-ecosystem//shared/libs/outbox"]
evidence = "Producers publish after their write. The plan adopts the outbox once a producer has a database of its own (O1), after its five known defects are fixed."
source = "capability-2026-10-19"
reviewed = false
as_of = 2026-10-19
review_after = 2027-01-17

[[motif]]
