# Curated motifs (tool/motifs.py): the design patterns the business's code repeats. One [[motif]] row per
# pattern: its name, the pattern in a sentence, the shared libraries that embody it (package ids; none for a
# pattern no library carries) and also_in anchors, each a package or project id, a repository-relative path
# (a file, or a directory and everything under it) and a text that every build re-finds in the tracked
# files of that checkout, comments stripped: where code does the same by hand. Nothing here is a claim of
# state: every build measures the packages importing each library and the anchors, and the views show the
# state (adopted, reimplemented, unused, no-library, not-measured). A library or anchor that code no longer
# holds is listed in QUEUE (motif-stale). Hand-edited; rows written by an agent read reviewed = false until
# Yu reviews them. Only forge ids, package ids, repository-relative anchors and short evidence belong here.

[[motif]]
name = "domain-events"
pattern = "A domain announces what happened as a named event on a shared transport, and other domains subscribe to it."
libraries = [
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/libs/messaging",
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/events/compliance-events",
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/events/entity-events",
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/events/financial-events",
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/events/legal-events",
  "pkg:github.com/cambridgetcg/business-ecosystem//shared/events/operational-events",
]
also_in = [
  { in = "pkg:github.com/cambridgetcg/business-ecosystem//operational/data-privacy", path = "operational/data-privacy/src/lib/events.ts", text = "import amqplib from 'amqplib'" },
  { in = "pkg:github.com/cambridgetcg/business-ecosystem//foundational/banking-treasury", path = "foundational/banking-treasury/src/infrastructure/aws/event-publisher.ts", text = "new PublishCommand(" },
  { in = "pkg:github.com/cambridgetcg/business-ecosystem//foundational/banking-treasury", path = "foundational/banking-treasury/src/core/events/event-bus.ts", text = "export class EventBus" },
  { in = "pkg:github.com/cambridgetcg/business-ecosystem//foundational/accounting", path = "foundational/accounting/src/infrastructure/messaging/publisher.py", text = "class InMemoryEventPublisher" },
  { in = "pkg:github.com/cambridgetcg/business-ecosystem//foundational/shared", path = "foundational/shared/src/integration/event-router.ts", text = "export class EventRouter" },
]
evidence = "messaging carries events over RabbitMQ and the events packages hold their schemas. Elsewhere data-privacy opens its own RabbitMQ channel, banking-treasury publishes to SNS and keeps its own bus, accounting keeps an in-memory publisher and foundational/shared routes events itself."
