name: Wire e2e

# Wire 1, end to end, on synthetic data: the commerce-intake producer
# (TypeScript) writes the event spool and accounting's commerce_posting
# consumer (Python) posts it through the real PostingService. Every stage runs
# through its public CLI in a child process, with network access refused.
# No path filter: it is cheap, and its latest run on main is the wire's
# evidence. Like every check here it is advisory, and it is not activation.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress, so
# only its latest head is checked. Every other run (pushes to main or develop,
# manual runs) is a group of its own: none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  wire-1:
    name: Wire 1 sale to ledger (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Build the producer and the contract packages it imports
        run: pnpm exec turbo run build --filter=@ecosystem/commerce-intake...
      - name: Install only the evidence test dependencies
        run: python -m pip install --requirement foundational/accounting/requirements-evidence.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run wire 1 from fixture to ledger, offline
        run: |
          scratch="$(mktemp -d "${RUNNER_TEMP}/wire-e2e.XXXXXX")"
          env -u PYTHONPATH -u PYTHONHOME TMPDIR="$scratch" \
            python -B -m unittest discover -s tests/wires -v
