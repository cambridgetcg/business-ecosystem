name: Workspace wiring

on:
  pull_request:
    paths:
      - '.github/workflows/workspace-wiring.yml'
      - 'gateway/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'shared/**/package.json'
      - 'operational/gateway/package.json'
  # Pushes to main and develop only, as in the other workflows: a pull
  # request's branch is checked through pull_request, and a push to it used to
  # run the same job a second time.
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/workspace-wiring.yml'
      - 'gateway/**'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'turbo.json'
      - 'shared/**/package.json'
      - 'operational/gateway/package.json'

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress, so
# only its latest head is checked. Every other run (a push to main or develop)
# is a group of its own: none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gateway-workspace:
    name: Gateway workspace and build plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      HUSKY: '0'
      TURBO_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.0.0
          run_install: false
      - name: Detect a missing gateway before installing dependencies
        run: node --test gateway/tests/workspace.test.mjs
      - name: Install the frozen workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts --ignore-pnpmfile
      - name: Test workspace membership and the dry build graph, not runtime health
        run: pnpm --filter @ecosystem/gateway run test
        env:
          TMPDIR: ${{ runner.temp }}
