name: Deploy Progress Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod
      action:
        description: 'Terraform action'
        required: true
        default: 'plan'
        type: choice
        options:
          - plan
          - apply
          - destroy

permissions:
  contents: read
  id-token: write

env:
  TF_VAR_environment: ${{ github.event.inputs.environment }}
  AWS_REGION: us-east-1

jobs:
  build-lambdas:
    name: Build Lambda Functions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: infrastructure/terraform/modules/progress-tracking/lambda/package.json

      - name: Install dependencies
        working-directory: infrastructure/terraform/modules/progress-tracking/lambda
        run: npm ci

      - name: Build and package
        working-directory: infrastructure/terraform/modules/progress-tracking/lambda
        run: npm run deploy

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lambda-packages
          path: |
            infrastructure/terraform/modules/progress-tracking/lambda/sync/sync.zip
            infrastructure/terraform/modules/progress-tracking/lambda/analyzer/analyzer.zip
            infrastructure/terraform/modules/progress-tracking/lambda/comparator/comparator.zip
            infrastructure/terraform/modules/progress-tracking/lambda/reporter/reporter.zip
            infrastructure/terraform/modules/progress-tracking/lambda/notifier/notifier.zip
            infrastructure/terraform/modules/progress-tracking/lambda/layers/dependencies.zip
          retention-days: 1

  terraform:
    name: Terraform ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    needs: build-lambdas
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: infrastructure/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Lambda packages
        uses: actions/download-artifact@v4
        with:
          name: lambda-packages
          path: infrastructure/terraform/modules/progress-tracking/lambda

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.6.0'

      - name: Create progress module configuration
        run: |
          cat > progress.tf << 'EOF'
          module "progress_tracking" {
            source = "./modules/progress-tracking"

            environment  = var.environment
            project_name = "ecosystem"
            aws_region   = var.aws_region

            github_repo   = "${{ github.repository }}"
            github_branch = "main"

            notification_email         = "${{ vars.NOTIFICATION_EMAIL }}"
            enable_slack_notifications = ${{ vars.ENABLE_SLACK == 'true' }}
            enable_email_notifications = true

            enable_timestream = false
            enable_quicksight = false

            tags = {
              Repository = "${{ github.repository }}"
              ManagedBy  = "terraform"
            }
          }

          output "progress_tracking" {
            value = module.progress_tracking.summary
          }
          EOF

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        run: |
          terraform plan \
            -target=module.progress_tracking \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        run: |
          terraform destroy \
            -target=module.progress_tracking \
            -var="environment=${{ github.event.inputs.environment }}" \
            -auto-approve

      - name: Output Summary
        if: github.event.inputs.action == 'apply'
        run: |
          echo "## Progress Infrastructure Deployed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Outputs:**" >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          terraform output -json progress_tracking >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  update-secrets:
    name: Update GitHub Secrets
    runs-on: ubuntu-latest
    needs: terraform
    if: github.event.inputs.action == 'apply'
    environment: ${{ github.event.inputs.environment }}

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get Lambda URL
        id: lambda
        run: |
          LAMBDA_NAME="ecosystem-progress-${{ github.event.inputs.environment }}-sync"
          URL=$(aws lambda get-function-url-config --function-name "$LAMBDA_NAME" --query 'FunctionUrl' --output text 2>/dev/null || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Update GitHub Secret
        if: steps.lambda.outputs.url != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Note: This requires repository admin permissions
            console.log('Lambda URL would be stored as PROGRESS_SYNC_LAMBDA_URL secret');
            console.log('URL:', '${{ steps.lambda.outputs.url }}');
            // Actual secret update requires additional permissions
