name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Weekly, for the quarantine report on main.
    - cron: '17 6 * * 1'

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress, so
# only its latest head is checked. Every other run (pushes to main or develop,
# the schedule, manual runs) is a group of its own: none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Package tasks listed in ci/quarantine.json are skipped by every turbo run
# below; scripts/ci-quarantine.mjs prints the --filter=!<package> arguments.
# Every job validates the list first: when it is invalid, $(...) prints no
# filters, and turbo would run unfiltered and fail on a quarantined task.
# The pnpm exec form matters: `pnpm lint --filter=...` would be read by pnpm.

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the quarantine list
        run: node scripts/ci-quarantine.mjs check
      - name: Lint
        run: pnpm exec turbo run lint $(node scripts/ci-quarantine.mjs lint)
      - name: Type Check
        run: pnpm exec turbo run typecheck $(node scripts/ci-quarantine.mjs typecheck)

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the quarantine list
        run: node scripts/ci-quarantine.mjs check
      - name: Build
        run: pnpm exec turbo run build $(node scripts/ci-quarantine.mjs build)
      - name: Test
        run: pnpm exec turbo run test $(node scripts/ci-quarantine.mjs test)
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the quarantine list
        run: node scripts/ci-quarantine.mjs check
      - name: Build All
        run: pnpm exec turbo run build $(node scripts/ci-quarantine.mjs build)

  # Pull requests only: re-measure quarantined tasks in the packages the PR
  # touches. Fails when a count rises, an entry now passes (remove it), the
  # list grows, or a new .ts file in a lint-quarantined package has errors.
  quarantine-ratchet:
    name: Quarantine ratchet
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Run every dependency lifecycle script, even from a cached store: the
      # Prisma packages' counts depend on the stub client @prisma/client's
      # postinstall writes, which pnpm's side-effects cache does not restore.
      - run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Validate the quarantine list
        run: node scripts/ci-quarantine.mjs check
      - name: Build what quarantined tasks compile against
        run: pnpm exec turbo run build $(node scripts/ci-quarantine.mjs build)
      - name: Re-measure quarantined tasks in touched packages
        run: node scripts/ci-quarantine.mjs ratchet "origin/${GITHUB_BASE_REF}"

  # Never blocks: re-measures every entry and writes the counts to the run
  # summary on pushes, manual runs and the weekly schedule, not on PRs.
  quarantine-report:
    name: Quarantine report
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      # Run every dependency lifecycle script, even from a cached store: the
      # Prisma packages' counts depend on the stub client @prisma/client's
      # postinstall writes, which pnpm's side-effects cache does not restore.
      - run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Validate the quarantine list
        run: node scripts/ci-quarantine.mjs check
      - name: Build what quarantined tasks compile against
        run: pnpm exec turbo run build $(node scripts/ci-quarantine.mjs build)
      - name: Re-measure every quarantined task
        shell: bash
        run: node scripts/ci-quarantine.mjs report | tee -a "$GITHUB_STEP_SUMMARY"
