name: Offline evidence

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/offline-evidence.yml'
      - 'scripts/portfolio.py'
      - 'tests/portfolio/**'
      - 'foundational/accounting/**'
      # The commerce event contract the accounting consumer mirrors.
      - 'shared/events/financial-events/schema/**'
      - 'shared/events/financial-events/conformance/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/offline-evidence.yml'
      - 'scripts/portfolio.py'
      - 'tests/portfolio/**'
      - 'foundational/accounting/**'
      # The commerce event contract the accounting consumer mirrors.
      - 'shared/events/financial-events/schema/**'
      - 'shared/events/financial-events/conformance/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress, so
# only its latest head is checked. Every other run (pushes to main or develop,
# manual runs) is a group of its own: none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-evidence:
    name: Python ${{ matrix.python }} synthetic evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install only the evidence test dependencies
        run: python -m pip install --requirement foundational/accounting/requirements-evidence.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Test the stdlib portfolio CLI with synthetic fixtures
        run: env -u PYTHONPATH -u PYTHONHOME python -B -m unittest discover -s tests/portfolio -v
      - name: Test all accounting invariants and evidence flows
        working-directory: foundational/accounting
        run: |
          scratch="$(mktemp -d "${RUNNER_TEMP}/accounting-tests.XXXXXX")"
          env -u PYTHONPATH -u PYTHONHOME \
            TMPDIR="$scratch" HYPOTHESIS_STORAGE_DIRECTORY="$scratch/hypothesis" \
            python -W error -m pytest -o addopts= \
              -o asyncio_default_fixture_loop_scope=function \
              tests -q --basetemp="$scratch/pytest" -p no:cacheprovider
      - name: Reopen the real posting demonstration in a separate process
        working-directory: foundational/accounting
        run: |
          output="$(mktemp -d "${RUNNER_TEMP}/payment-evidence.XXXXXX")"
          env -u PYTHONPATH -u PYTHONHOME python -B scripts/payment_evidence_demo.py demo \
            --db "$output/evidence.sqlite3" --out "$output/demo"
          env -u PYTHONPATH -u PYTHONHOME python -B scripts/payment_evidence_demo.py report \
            --db "$output/evidence.sqlite3" --out "$output/reopened"
          cmp "$output/demo/report.json" "$output/reopened/report.json"
          cmp "$output/demo/report.md" "$output/reopened/report.md"
