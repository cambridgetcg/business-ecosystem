name: Estate

# The estate layer's test suite (estate/tests): standard-library Python over
# synthetic estates built in temporary directories, with launchctl, crontab, gh
# and bun stubbed. It reads no real estate and makes no network call. It runs
# only when estate/** or this file changes. Like every check here it is
# advisory.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - '.github/workflows/estate.yml'
      - 'estate/**'
  push:
    branches: [main, develop]
    paths:
      - '.github/workflows/estate.yml'
      - 'estate/**'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that pull request's run in progress, so
# only its latest head is checked. Every other run (pushes to main or develop,
# manual runs) is a group of its own: none is cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  estate-tests:
    name: Estate tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Run the estate suite
        run: env -u PYTHONPATH -u PYTHONHOME python -I -B -m unittest discover -s estate/tests -t estate
